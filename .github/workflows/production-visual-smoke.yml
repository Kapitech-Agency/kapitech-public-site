name: Kapitech production visual navigation smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Test direct, client navigation, and language variants
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const articleId = 'https://kapitech.id/insights/mvp-vs-prototype-vs-proof-of-concept';
          const articleEn = 'https://kapitech.id/insights/mvp-vs-prototype-vs-proof-of-concept-guide';

          const browser = await chromium.launch({ headless: true });
          const cases = [
            { name: 'direct-id', url: articleId, storage: null, locale: 'en-US' },
            { name: 'direct-id-saved-en', url: articleId, storage: 'en', locale: 'en-US' },
            { name: 'direct-id-saved-id', url: articleId, storage: 'id', locale: 'id-ID' },
            { name: 'direct-en', url: articleEn, storage: 'en', locale: 'en-US' },
          ];

          for (const c of cases) {
            const context = await browser.newContext({ locale: c.locale });
            const page = await context.newPage();
            const errors = [];
            const failed = [];

            page.on('pageerror', e => errors.push(e?.stack || e?.message || String(e)));
            page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });
            page.on('requestfailed', r => failed.push([r.url(), r.failure()?.errorText || 'unknown']));

            if (c.storage) {
              await page.addInitScript(value => localStorage.setItem('kapitech_lang', value), c.storage);
            }

            await page.goto(c.url, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(5000);

            const metrics = await page.evaluate(() => {
              const root = document.getElementById('root');
              const body = document.body;
              const article = document.querySelector('article');
              const main = document.querySelector('main');
              const hidden = (el) => {
                if (!el) return null;
                const s = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return {
                  display: s.display,
                  visibility: s.visibility,
                  opacity: s.opacity,
                  position: s.position,
                  zIndex: s.zIndex,
                  width: r.width,
                  height: r.height,
                  top: r.top,
                  left: r.left
                };
              };
              const point = document.elementFromPoint(window.innerWidth / 2, 160);
              return {
                href: location.href,
                title: document.title,
                viewport: { width: innerWidth, height: innerHeight },
                body: hidden(body),
                root: hidden(root),
                article: hidden(article),
                main: hidden(main),
                rootHtmlLength: root?.innerHTML?.length || 0,
                bodyTextLength: body?.innerText?.length || 0,
                bodyTextStart: body?.innerText?.slice(0, 300) || '',
                elementAtCenterTop: point ? {
                  tag: point.tagName,
                  id: point.id,
                  className: typeof point.className === 'string' ? point.className : '',
                  text: (point.textContent || '').slice(0, 120)
                } : null
              };
            });

            console.log(JSON.stringify({ case: c.name, metrics, errors, failed }, null, 2));

            assert.equal(errors.length, 0, c.name + ' has runtime errors');
            assert.equal(metrics.root?.display, 'block', c.name + ' root display');
            assert.equal(metrics.root?.visibility, 'visible', c.name + ' root visibility');
            assert.ok((metrics.root?.opacity ?? 0) > 0, c.name + ' root opacity');
            assert.ok(metrics.root?.height > 200, c.name + ' root height');
            assert.ok(metrics.bodyTextLength > 1000, c.name + ' rendered text');
            assert.ok(metrics.rootHtmlLength > 5000, c.name + ' rendered DOM');

            await page.screenshot({ path: '/tmp/' + c.name + '.png', fullPage: true });
            await context.close();
          }

          {
            const context = await browser.newContext({ locale: 'en-US' });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(e?.stack || e?.message || String(e)));
            page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });

            await page.goto('https://kapitech.id/insights', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(3000);

            const firstArticleLink = page.locator('a[href^="/insights/"]').first();
            const href = await firstArticleLink.getAttribute('href');
            assert.ok(href, 'Insight library has no article link');

            await firstArticleLink.click();
            await page.waitForTimeout(5000);

            const result = await page.evaluate(() => {
              const root = document.getElementById('root');
              return {
                href: location.href,
                bodyTextLength: document.body.innerText.length,
                rootHtmlLength: root?.innerHTML?.length || 0,
                title: document.title
              };
            });

            console.log(JSON.stringify({ case: 'client-navigation', result, errors }, null, 2));
            assert.equal(errors.length, 0, 'client-navigation has runtime errors');
            assert.match(result.href, /\/insights\//);
            assert.ok(result.bodyTextLength > 1000, 'client-navigation rendered text');
            assert.ok(result.rootHtmlLength > 5000, 'client-navigation rendered DOM');

            await page.screenshot({ path: '/tmp/client-navigation.png', fullPage: true });
            await context.close();
          }

          await browser.close();
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insight-visual-smoke
          path: /tmp/*.png
          if-no-files-found: ignore
