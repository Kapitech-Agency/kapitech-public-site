name: Kapitech public site CI

on:
  push:
    branches: [main, redesign/v2]
  pull_request:
    branches: [main]

concurrency:
  group: public-site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build

  production-smoke:
    name: Production Insight smoke test
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check deployed build marker
        run: |
          set -euo pipefail
          marker="$(curl -fsSL --max-time 20 https://kapitech.id/kapitech-deployment-health.txt)"
          echo "$marker"
          echo "$marker" | grep -F "Required deployed baseline: e462d195e77916e2f71990751e85c39687b1b88e"

      - name: Check Insight API
        run: |
          set -euo pipefail
          body="$(curl -fsSL --max-time 20 \
            -H "Origin: https://kapitech.id" \
            https://ams.kapitech.id/api/cms/insights/mvp-vs-prototype-vs-proof-of-concept)"
          echo "$body" | grep -F '"success":true'
          echo "$body" | grep -F '"slug":"mvp-vs-prototype-vs-proof-of-concept"'

      - name: Check Insight route
        run: |
          set -euo pipefail
          html="$(curl -fsSL --max-time 20 \
            https://kapitech.id/insights/mvp-vs-prototype-vs-proof-of-concept)"
          echo "$html" | grep -F 'MVP vs Prototype vs Proof of Concept'
          echo "$html" | grep -F '<script type="module"'
