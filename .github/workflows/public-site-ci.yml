name: Kapitech public site CI

on:
  push:
    branches: [main, redesign/v2]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: public-site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diagnostic install
        shell: bash
        run: |
          set +e
          node --version
          npm --version
          npm install 2>&1 | tee install-output.log
          echo ${PIPESTATUS[0]} > install-exit-code.txt
          exit 0
      - name: Diagnostic lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint-output.log
          echo $? > lint-exit-code.txt
          exit 0
      - name: Diagnostic build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build-output.log
          echo $? > build-exit-code.txt
          exit 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-build-diagnostics
          path: |
            lint-output.log
            lint-exit-code.txt
            build-output.log
            build-exit-code.txt
          if-no-files-found: error
      - name: Post diagnostic output to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (file) => {
              try { return fs.readFileSync(file, 'utf8'); } catch { return '(not generated)'; }
            };
            const body = [
              '## Build diagnostic output',
              '',
              '### Install',
              '```text',
              read('install-output.log').slice(-12000),
              '```',
              '',
              '### Lint',
              '```text',
              read('lint-output.log').slice(-16000),
              '```',
              '',
              '### Build',
              '```text',
              read('build-output.log').slice(-20000),
              '```',
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
      - name: Enforce lint/build result
        shell: bash
        run: |
          lint_code=$(cat lint-exit-code.txt)
          build_code=$(cat build-exit-code.txt)
          install_code=$(cat install-exit-code.txt)
          if [ "$install_code" -ne 0 ] || [ "$lint_code" -ne 0 ] || [ "$build_code" -ne 0 ]; then
            echo "Diagnostic install exit: $install_code"
            echo "Diagnostic lint exit: $lint_code"
            echo "Diagnostic build exit: $build_code"
            exit 1
          fi
