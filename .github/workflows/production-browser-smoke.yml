name: Kapitech production browser smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kapitech-production-browser-smoke
  cancel-in-progress: true

jobs:
  browser:
    name: Render live Insight in Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render live article
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const url = 'https://kapitech.id/insights/mvp-vs-prototype-vs-proof-of-concept';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });

          const consoleErrors = [];
          const pageErrors = [];
          const failedRequests = [];

          page.on('console', (message) => {
            if (message.type() === 'error') {
              consoleErrors.push(message.text());
            }
          });

          page.on('pageerror', (error) => {
            pageErrors.push(error?.stack || error?.message || String(error));
          });

          page.on('requestfailed', (request) => {
            failedRequests.push({
              url: request.url(),
              method: request.method(),
              errorText: request.failure()?.errorText || 'unknown'
            });
          });

          let response;
          try {
            response = await page.goto(url, {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });
            await page.waitForTimeout(7000);

            const bodyText = await page.locator('body').innerText();
            const title = await page.title();
            const rootText = await page.locator('#root').innerText().catch(() => '');

            const report = {
              status: response?.status(),
              finalUrl: page.url(),
              title,
              bodyText: bodyText.slice(0, 5000),
              rootText: rootText.slice(0, 5000),
              consoleErrors,
              pageErrors,
              failedRequests,
              rootChildCount: await page.locator('#root > *').count()
            };

            console.log(JSON.stringify(report, null, 2));
            await writeFile('/tmp/insight-browser-report.json', JSON.stringify(report, null, 2));
            await page.screenshot({
              path: '/tmp/insight-browser.png',
              fullPage: true
            });

            const hasArticle =
              bodyText.includes('MVP vs Prototype vs Proof of Concept') &&
              bodyText.length > 500;

            if (!response || response.status() >= 400) {
              process.exitCode = 1;
            } else if (!hasArticle) {
              console.error('LIVE INSIGHT DID NOT RENDER EXPECTED ARTICLE CONTENT');
              process.exitCode = 1;
            } else if (pageErrors.length > 0) {
              console.error('LIVE INSIGHT HAS PAGE ERRORS');
              process.exitCode = 1;
            }
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insight-browser-diagnostics
          path: |
            /tmp/insight-browser-report.json
            /tmp/insight-browser.png
          if-no-files-found: ignore
