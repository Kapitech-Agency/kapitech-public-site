<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">Prototype vs MVP vs PoC</title><desc id="desc">A compact evidence matrix.</desc><rect width="1500" height="900" fill="#0B0C0E"/><style>text{font-family:Inter,Arial,sans-serif}</style><text x="70" y="80" font-size="18" letter-spacing="4" fill="#E50914">04 / COMPARISON</text><text x="70" y="138" font-size="42" font-weight="700" fill="#F8FAFC">Choose by evidence, not by size.</text><rect x="70" y="190" width="1360" height="610" rx="26" fill="#111318" stroke="#2A2D34"/><g font-size="15" font-weight="700" fill="#F8FAFC"><text x="105" y="238">DIMENSION</text><text x="550" y="238">PROTOTYPE</text><text x="900" y="238">MVP</text><text x="1245" y="238">PoC</text></g><line x1="95" y1="270" x2="1405" y2="270" stroke="#2A2D34"/><line x1="500" y1="190" x2="500" y2="800" stroke="#2A2D34"/><line x1="845" y1="190" x2="845" y2="800" stroke="#2A2D34"/><line x1="1190" y1="190" x2="1190" y2="800" stroke="#2A2D34"/><g><text x="105" y="310" font-size="14" fill="#818996">Purpose</text><text x="550" y="310" font-size="14" fill="#D8DDE5">Validate experience</text><text x="900" y="310" font-size="14" fill="#D8DDE5">Validate value</text><text x="1245" y="310" font-size="14" fill="#D8DDE5">Validate feasibility</text><line x1="95" y1="345" x2="1405" y2="345" stroke="#20232A"/></g><g><text x="105" y="388" font-size="14" fill="#818996">Real users</text><text x="550" y="388" font-size="14" fill="#D8DDE5">Optional</text><text x="900" y="388" font-size="14" fill="#D8DDE5">Important</text><text x="1245" y="388" font-size="14" fill="#D8DDE5">Not primary</text><line x1="95" y1="423" x2="1405" y2="423" stroke="#20232A"/></g><g><text x="105" y="466" font-size="14" fill="#818996">Technical depth</text><text x="550" y="466" font-size="14" fill="#D8DDE5">Low → medium</text><text x="900" y="466" font-size="14" fill="#D8DDE5">Medium → high</text><text x="1245" y="466" font-size="14" fill="#D8DDE5">High in tested area</text><line x1="95" y1="501" x2="1405" y2="501" stroke="#20232A"/></g><g><text x="105" y="544" font-size="14" fill="#818996">Best evidence</text><text x="550" y="544" font-size="14" fill="#D8DDE5">Usability / comprehension</text><text x="900" y="544" font-size="14" fill="#D8DDE5">Usage / behavior</text><text x="1245" y="544" font-size="14" fill="#D8DDE5">Integration / performance</text><line x1="95" y1="579" x2="1405" y2="579" stroke="#20232A"/></g><g><text x="105" y="622" font-size="14" fill="#818996">Production ready</text><text x="550" y="622" font-size="14" fill="#D8DDE5">No</text><text x="900" y="622" font-size="14" fill="#D8DDE5">Not automatically</text><text x="1245" y="622" font-size="14" fill="#D8DDE5">No</text><line x1="95" y1="657" x2="1405" y2="657" stroke="#20232A"/></g><g><text x="105" y="700" font-size="14" fill="#818996">Next decision</text><text x="550" y="700" font-size="14" fill="#D8DDE5">Change experience</text><text x="900" y="700" font-size="14" fill="#D8DDE5">Continue / change / stop</text><text x="1245" y="700" font-size="14" fill="#D8DDE5">Proceed / change technology</text><line x1="95" y1="735" x2="1405" y2="735" stroke="#20232A"/></g><text x="70" y="855" font-size="16" fill="#69717D">The question determines the method. Evidence determines the decision.</text></svg>