<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Prototype MVP PoC comparison</title><desc id="desc">Comparison of purpose, users, technical depth, evidence, and readiness.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="3.2">COMPARISON</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="start">Prototype vs MVP vs PoC</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Use the row that matches your risk, not the label that sounds most complete.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="1408" y="110" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">04 / 05</text>
<rect x="96" y="286" width="1368" height="56" rx="16" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="118" y="322" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.6">DECISION FACTOR</text><text x="582" y="322" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.8">PROTOTYPE</text><text x="882" y="322" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.8">MVP</text><text x="1182" y="322" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.8">POC</text>
<rect x="96" y="352" width="1368" height="70" rx="16" fill="#15181D" stroke="#292E36" stroke-width="1"/><text x="118" y="394" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Primary question</text><text x="582" y="394" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">Can users use it?</text><text x="882" y="394" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">Will users value it?</text><text x="1182" y="394" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">Can it work?</text>
<rect x="96" y="422" width="1368" height="70" rx="16" fill="#191C22" stroke="#292E36" stroke-width="1"/><text x="118" y="464" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Real users</text><text x="582" y="464" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Usually test users</text><text x="882" y="464" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">Required</text><text x="1182" y="464" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Optional / technical</text>
<rect x="96" y="492" width="1368" height="70" rx="16" fill="#15181D" stroke="#292E36" stroke-width="1"/><text x="118" y="534" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Technical depth</text><text x="582" y="534" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Low to medium</text><text x="882" y="534" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">Production-shaped</text><text x="1182" y="534" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">Targeted proof</text>
<rect x="96" y="562" width="1368" height="70" rx="16" fill="#191C22" stroke="#292E36" stroke-width="1"/><text x="118" y="604" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Best evidence</text><text x="582" y="604" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">Usability signal</text><text x="882" y="604" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">Behavior + value</text><text x="1182" y="604" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">Feasibility signal</text>
<rect x="96" y="632" width="1368" height="70" rx="16" fill="#15181D" stroke="#292E36" stroke-width="1"/><text x="118" y="674" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Main failure</text><text x="582" y="674" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Beautiful but confusing</text><text x="882" y="674" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Build too much too early</text><text x="1182" y="674" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Proves one slice only</text>
<rect x="96" y="734" width="1368" height="48" rx="14" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="120" y="765" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2">Use this when:</text><text x="208" y="765" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">the cost of being wrong matters more than the cost of running the experiment.</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.4">04 / COMPARE BY EVIDENCE</text><text x="1504" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>