<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">Prototype vs MVP vs PoC</title><desc id="desc">Evidence matrix for choosing the right validation method.</desc><defs><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171A20"/><stop offset="1" stop-color="#0F1116"/></linearGradient></defs><rect width="1500" height="900" fill="#0B0C0E"/><style>text{font-family:Inter,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}</style><text x="70" y="72" font-size="16" letter-spacing="3.6" fill="#E50914" class="mono">04 / COMPARISON</text><text x="70" y="122" font-size="38" font-weight="700" fill="#F8FAFC">Choose by evidence, not by size.</text><rect x="70" y="185" width="300" height="72" rx="18" fill="#111318" stroke="#2A2D34"/><text x="94" y="228" font-size="13" font-weight="700" fill="#7F8795" class="mono" letter-spacing="1.2">DIMENSION</text><rect x="378" y="185" width="340" height="72" rx="18" fill="#111318" stroke="#2A2D34"/><text x="402" y="228" font-size="13" font-weight="700" fill="#F8FAFC" class="mono" letter-spacing="1.2">PROTOTYPE</text><rect x="726" y="185" width="340" height="72" rx="18" fill="#111318" stroke="#2A2D34"/><text x="750" y="228" font-size="13" font-weight="700" fill="#F8FAFC" class="mono" letter-spacing="1.2">MVP</text><rect x="1074" y="185" width="340" height="72" rx="18" fill="#111318" stroke="#2A2D34"/><text x="1098" y="228" font-size="13" font-weight="700" fill="#F8FAFC" class="mono" letter-spacing="1.2">PoC</text><rect x="70" y="275" width="300" height="98" rx="14" fill="#15171C" stroke="#2A2D34"/><text x="94" y="313" font-size="12" font-weight="600" fill="#7F8795">Question</text><rect x="378" y="275" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="402" y="313" font-size="14" font-weight="400" fill="#C7CCD5">Can users use it?</text><rect x="726" y="275" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="750" y="313" font-size="14" font-weight="400" fill="#C7CCD5">Will users value it?</text><rect x="1074" y="275" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="1098" y="313" font-size="14" font-weight="400" fill="#C7CCD5">Can this approach work?</text><rect x="70" y="381" width="300" height="98" rx="14" fill="#15171C" stroke="#2A2D34"/><text x="94" y="419" font-size="12" font-weight="600" fill="#7F8795">Evidence</text><rect x="378" y="381" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="402" y="419" font-size="14" font-weight="400" fill="#C7CCD5">Usability / feedback</text><rect x="726" y="381" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="750" y="419" font-size="14" font-weight="400" fill="#C7CCD5">Usage / adoption</text><rect x="1074" y="381" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="1098" y="419" font-size="14" font-weight="400" fill="#C7CCD5">Integration / performance</text><rect x="70" y="487" width="300" height="98" rx="14" fill="#15171C" stroke="#2A2D34"/><text x="94" y="525" font-size="12" font-weight="600" fill="#7F8795">Focus</text><rect x="378" y="487" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="402" y="525" font-size="14" font-weight="400" fill="#C7CCD5">Experience</text><rect x="726" y="487" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="750" y="525" font-size="14" font-weight="400" fill="#C7CCD5">Value</text><rect x="1074" y="487" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="1098" y="525" font-size="14" font-weight="400" fill="#C7CCD5">Feasibility</text><rect x="70" y="593" width="300" height="98" rx="14" fill="#15171C" stroke="#2A2D34"/><text x="94" y="631" font-size="12" font-weight="600" fill="#7F8795">Users</text><rect x="378" y="593" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="402" y="631" font-size="14" font-weight="400" fill="#C7CCD5">Useful, not always required</text><rect x="726" y="593" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="750" y="631" font-size="14" font-weight="400" fill="#C7CCD5">Central to the test</text><rect x="1074" y="593" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="1098" y="631" font-size="14" font-weight="400" fill="#C7CCD5">Usually not primary</text><rect x="70" y="699" width="300" height="98" rx="14" fill="#15171C" stroke="#2A2D34"/><text x="94" y="737" font-size="12" font-weight="600" fill="#7F8795">Next decision</text><rect x="378" y="699" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="402" y="737" font-size="14" font-weight="400" fill="#C7CCD5">Change the experience</text><rect x="726" y="699" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="750" y="737" font-size="14" font-weight="400" fill="#C7CCD5">Continue / change / stop</text><rect x="1074" y="699" width="340" height="98" rx="14" fill="#0F1115" stroke="#2A2D34"/><text x="1098" y="737" font-size="14" font-weight="400" fill="#C7CCD5">Proceed / change technology</text><text x="70" y="872" font-size="14" fill="#7F8795">The question determines the method. Evidence determines the decision.</text></svg>