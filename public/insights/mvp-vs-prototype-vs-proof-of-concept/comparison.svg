<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
<title id="title">Prototype vs MVP vs PoC at a glance</title>
<desc id="desc">A quick comparison of purpose, real users, technical depth, and production readiness.</desc>
<rect width="1500" height="930" fill="#0B0C0E"/>
<g font-family="Inter,Arial,sans-serif">
<text x="70" y="82" font-size="18" letter-spacing="4" fill="#E50914">04 / AT A GLANCE</text>
<text x="70" y="140" font-size="46" font-weight="700" fill="#F8FAFC">They answer different questions.</text>
<rect x="70" y="190" width="1360" height="640" rx="28" fill="#111318" stroke="#2A2D34"/>
<g fill="#fff" font-weight="700" font-size="21">
<text x="110" y="250">DIMENSION</text><text x="560" y="250">PROTOTYPE</text><text x="925" y="250">MVP</text><text x="1260" y="250">PoC</text>
</g>
<g font-size="18">
<g fill="#8A909D">
<text x="110" y="305">Primary goal</text><text x="110" y="365">Real users</text><text x="110" y="425">UX fidelity</text><text x="110" y="485">Technical depth</text><text x="110" y="545">Business validation</text><text x="110" y="605">Technical validation</text><text x="110" y="665">Production-ready</text><text x="110" y="725">Best evidence</text>
</g>
<g fill="#DDE1E8">
<text x="560" y="305">UX validation</text><text x="925" y="305">Value validation</text><text x="1260" y="305">Feasibility</text>
<text x="560" y="365">Optional</text><text x="925" y="365">Important</text><text x="1260" y="365">Usually not primary</text>
<text x="560" y="425">Low → High</text><text x="925" y="425">Medium → High</text><text x="1260" y="425">Low</text>
<text x="560" y="485">Low → Medium</text><text x="925" y="485">Medium → High</text><text x="1260" y="485">High</text>
<text x="560" y="545">Limited</text><text x="925" y="545">High</text><text x="1260" y="545">Limited</text>
<text x="560" y="605">Limited</text><text x="925" y="605">Some</text><text x="1260" y="605">High</text>
<text x="560" y="665">No</text><text x="925" y="665">Limited / controlled</text><text x="1260" y="665">No</text>
<text x="560" y="725">"Can users use it?"</text><text x="925" y="725">"Will users value it?"</text><text x="1260" y="725">"Can we build it?"</text>
</g>
</g>
<line x1="70" y1="270" x2="1430" y2="270" stroke="#2A2D34"/>
<g stroke="#24272E"><line x1="500" y1="190" x2="500" y2="830"/><line x1="865" y1="190" x2="865" y2="830"/><line x1="1220" y1="190" x2="1220" y2="830"/></g>
</g>
<text x="70" y="875" font-size="17" fill="#69717D">“Minimum” and “prototype” describe different things. The right choice depends on the uncertainty you need to reduce.</text>
</g></svg>