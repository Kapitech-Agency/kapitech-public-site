<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Kerangka validasi Kapitech</title><desc id="desc">Risk ke metode, bukti, threshold, dan keputusan.</desc><defs><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171A20"/><stop offset="1" stop-color="#0F1116"/></linearGradient></defs><rect width="1400" height="760" fill="#0B0C0E"/><style>text{font-family:Inter,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}</style><text x="70" y="72" font-size="16" letter-spacing="3.6" fill="#E50914" class="mono">06 / PERSPEKTIF KAPITECH</text><text x="70" y="122" font-size="38" font-weight="700" fill="#F8FAFC">Petakan risiko sebelum roadmap.</text><line x1="150" y1="330" x2="1250" y2="330" stroke="#2A2D34" stroke-width="2"/><circle cx="150" cy="330" r="52" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="150" y="315" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="#7F8795" class="mono">01 / RISK</text><text x="150" y="347" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Identifikasi</text><text x="150" y="425" text-anchor="middle" font-size="14" fill="#C7CCD5">Apa yang bisa gagal?</text><path d="M203 330 H277" stroke="#E50914" stroke-width="2.5" fill="none"/><path d="M268 324 l10 6 -10 6" fill="#E50914"/><circle cx="410" cy="330" r="52" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="410" y="315" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="#7F8795" class="mono">02 / METHOD</text><text x="410" y="347" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Pilih</text><text x="410" y="425" text-anchor="middle" font-size="14" fill="#C7CCD5">Prototype / MVP / PoC</text><path d="M463 330 H537" stroke="#E50914" stroke-width="2.5" fill="none"/><path d="M528 324 l10 6 -10 6" fill="#E50914"/><circle cx="670" cy="330" r="52" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="670" y="315" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="#7F8795" class="mono">03 / EVIDENCE</text><text x="670" y="347" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Amati</text><text x="670" y="425" text-anchor="middle" font-size="14" fill="#C7CCD5">Sinyal yang terlihat</text><path d="M723 330 H797" stroke="#E50914" stroke-width="2.5" fill="none"/><path d="M788 324 l10 6 -10 6" fill="#E50914"/><circle cx="930" cy="330" r="52" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="930" y="315" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="#7F8795" class="mono">04 / THRESHOLD</text><text x="930" y="347" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Nilai</text><text x="930" y="425" text-anchor="middle" font-size="14" fill="#C7CCD5">Cukup kuat?</text><path d="M983 330 H1057" stroke="#E50914" stroke-width="2.5" fill="none"/><path d="M1048 324 l10 6 -10 6" fill="#E50914"/><circle cx="1190" cy="330" r="52" fill="#111318" stroke="#E50914" stroke-width="2"/><text x="1190" y="315" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="#E50914" class="mono">05 / DECISION</text><text x="1190" y="347" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Tindak</text><text x="1190" y="425" text-anchor="middle" font-size="14" fill="#C7CCD5">Lanjut / ubah / stop</text><rect x="70" y="545" width="1260" height="110" rx="24" fill="#111318" stroke="#2A2D34"/><text x="102" y="585" font-size="10" letter-spacing="2.2" fill="#E50914" class="mono">MENTAL MODEL</text><text x="102" y="623" font-size="22" font-weight="700" fill="#F8FAFC">Pilih eksperimen terkecil yang tetap menghasilkan bukti yang kredibel.</text></svg>