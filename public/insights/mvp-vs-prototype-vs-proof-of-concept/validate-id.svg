<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 740" role="img" aria-labelledby="title desc"><title id="title">Apa yang divalidasi oleh tiap pendekatan?</title><desc id="desc">Tiga pendekatan, tiga pertanyaan, tiga jenis bukti.</desc><rect width="1400" height="740" fill="#0B0C0E"/><style>text{font-family:Inter,Arial,sans-serif}</style><text x="70" y="80" font-size="18" letter-spacing="4" fill="#E50914">01 / FOKUS VALIDASI</text><text x="70" y="138" font-size="42" font-weight="700" fill="#F8FAFC">Satu ketidakpastian. Satu bukti utama.</text><g transform="translate(70 210)"><rect width="370" height="375" rx="28" fill="#111318" stroke="#2A2D34"/><text x="30" y="42" font-size="13" fill="#E50914">01</text><text x="30" y="92" font-size="13" letter-spacing="2.2" fill="#69717D">PENGALAMAN</text><text x="30" y="138" font-size="30" font-weight="700" fill="#F8FAFC">PROTOTYPE</text><line x1="30" y1="168" x2="340" y2="168" stroke="#2A2D34"/><text x="30" y="218" font-size="18" font-weight="600" fill="#F8FAFC">Apakah pengguna dapat menggunakannya?</text><text x="30" y="276" font-size="12" letter-spacing="2" fill="#69717D">EVIDENCE</text><text x="30" y="306" font-size="15" fill="#C7CCD5">Flow / usability · pemahaman</text><rect x="30" y="350" width="56" height="3" rx="1.5" fill="#E50914"/></g><g transform="translate(515 210)"><rect width="370" height="375" rx="28" fill="#111318" stroke="#2A2D34"/><text x="30" y="42" font-size="13" fill="#E50914">02</text><text x="30" y="92" font-size="13" letter-spacing="2.2" fill="#69717D">NILAI</text><text x="30" y="138" font-size="30" font-weight="700" fill="#F8FAFC">MVP</text><line x1="30" y1="168" x2="340" y2="168" stroke="#2A2D34"/><text x="30" y="218" font-size="18" font-weight="600" fill="#F8FAFC">Apakah pengguna memberi nilai?</text><text x="30" y="276" font-size="12" letter-spacing="2" fill="#69717D">EVIDENCE</text><text x="30" y="306" font-size="15" fill="#C7CCD5">Penggunaan / adopsi · pembelajaran</text><rect x="30" y="350" width="56" height="3" rx="1.5" fill="#E50914"/></g><g transform="translate(960 210)"><rect width="370" height="375" rx="28" fill="#111318" stroke="#2A2D34"/><text x="30" y="42" font-size="13" fill="#E50914">03</text><text x="30" y="92" font-size="13" letter-spacing="2.2" fill="#69717D">TEKNIS</text><text x="30" y="138" font-size="30" font-weight="700" fill="#F8FAFC">PoC</text><line x1="30" y1="168" x2="340" y2="168" stroke="#2A2D34"/><text x="30" y="218" font-size="18" font-weight="600" fill="#F8FAFC">Apakah pendekatan ini bisa bekerja?</text><text x="30" y="276" font-size="12" letter-spacing="2" fill="#69717D">EVIDENCE</text><text x="30" y="306" font-size="15" fill="#C7CCD5">Integrasi / performa · batasan</text><rect x="30" y="350" width="56" height="3" rx="1.5" fill="#E50914"/></g><text x="70" y="670" font-size="16" fill="#69717D">Apa yang divalidasi oleh tiap pendekatan? — the method follows the question.</text></svg>