<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Apa yang divalidasi setiap pendekatan?</title><desc id="desc">Tiga metode, tiga pertanyaan, tiga jenis bukti.</desc><defs><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171A20"/><stop offset="1" stop-color="#0F1116"/></linearGradient></defs><rect width="1400" height="760" fill="#0B0C0E"/><style>text{font-family:Inter,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}</style><text x="70" y="72" font-size="16" letter-spacing="3.6" fill="#E50914" class="mono">01 / FOKUS VALIDASI</text><text x="70" y="122" font-size="38" font-weight="700" fill="#F8FAFC">Satu ketidakpastian. Satu bukti utama.</text><text x="70" y="154" font-size="14" fill="#7F8795">Pilih metode yang menjawab pertanyaan, bukan yang terdengar paling besar.</text><rect x="70" y="218" width="400" height="410" rx="22" fill="url(#fade)" stroke="#2A2D34"/><text x="98" y="256" font-size="12" fill="#E50914" class="mono">01</text><text x="98" y="288" font-size="10" letter-spacing="2.1" fill="#7F8795" class="mono">EXPERIENCE</text><text x="98" y="334" font-size="28" font-weight="700" fill="#F8FAFC">Prototype</text><line x1="98" y1="356" x2="442" y2="356" stroke="#2A2D34"/><text x="98" y="406" font-size="18" font-weight="600" fill="#F8FAFC">Bagaimana pengalaman ini bekerja?</text><text x="98" y="466" font-size="10" letter-spacing="1.8" fill="#7F8795" class="mono">EVIDENCE</text><text x="98" y="500" font-size="14" fill="#C7CCD5">Alur, usability, comprehension</text><rect x="98" y="568" width="52" height="3" rx="1.5" fill="#E50914"/><rect x="500" y="218" width="400" height="410" rx="22" fill="url(#fade)" stroke="#2A2D34"/><text x="528" y="256" font-size="12" fill="#E50914" class="mono">02</text><text x="528" y="288" font-size="10" letter-spacing="2.1" fill="#7F8795" class="mono">VALUE</text><text x="528" y="334" font-size="28" font-weight="700" fill="#F8FAFC">MVP</text><line x1="528" y1="356" x2="872" y2="356" stroke="#2A2D34"/><text x="528" y="406" font-size="18" font-weight="600" fill="#F8FAFC">Apakah pengguna menghargainya?</text><text x="528" y="466" font-size="10" letter-spacing="1.8" fill="#7F8795" class="mono">EVIDENCE</text><text x="528" y="500" font-size="14" fill="#C7CCD5">Usage, adoption, learning</text><rect x="528" y="568" width="52" height="3" rx="1.5" fill="#E50914"/><rect x="930" y="218" width="400" height="410" rx="22" fill="url(#fade)" stroke="#2A2D34"/><text x="958" y="256" font-size="12" fill="#E50914" class="mono">03</text><text x="958" y="288" font-size="10" letter-spacing="2.1" fill="#7F8795" class="mono">TECHNICAL</text><text x="958" y="334" font-size="28" font-weight="700" fill="#F8FAFC">PoC</text><line x1="958" y1="356" x2="1302" y2="356" stroke="#2A2D34"/><text x="958" y="406" font-size="18" font-weight="600" fill="#F8FAFC">Bisakah pendekatan ini bekerja?</text><text x="958" y="466" font-size="10" letter-spacing="1.8" fill="#7F8795" class="mono">EVIDENCE</text><text x="958" y="500" font-size="14" fill="#C7CCD5">Integration, performance, constraints</text><rect x="958" y="568" width="52" height="3" rx="1.5" fill="#E50914"/><text x="70" y="700" font-size="15" fill="#7F8795">Pertanyaan menentukan metode. Bukti menentukan keputusan.</text></svg>