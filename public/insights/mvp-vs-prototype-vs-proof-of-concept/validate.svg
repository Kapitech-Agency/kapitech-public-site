<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">What each validation method proves</title><desc id="desc">Prototype, MVP, and proof of concept each produce a different type of evidence.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="3.2">VALIDATION TARGETS</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="start">Three questions. Three evidence types.</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">The method is correct when its output can change the decision.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="1408" y="110" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">02 / 05</text>
<rect x="96" y="286" width="430" height="430" rx="26" fill="#191C22" stroke="#292E36" stroke-width="1"/><rect x="128" y="316" width="145" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="200.5" y="338" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">PROTOTYPE</text><text x="128" y="382" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">Experience</text><text x="128" y="420" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Do people understand</text><text x="128" y="446" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">and use the flow?</text><rect x="128" y="484" width="366" height="88" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="152" y="514" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.8">EVIDENCE</text><text x="152" y="545" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">Observed usability signals</text><text x="152" y="568" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">friction, comprehension, task completion</text>
<rect x="585" y="286" width="430" height="430" rx="26" fill="#191C22" stroke="#292E36" stroke-width="1"/><rect x="617" y="316" width="100" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="667" y="338" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">MVP</text><text x="617" y="382" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">Product value</text><text x="617" y="420" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Do real users return</text><text x="617" y="446" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">because it solves a need?</text><rect x="617" y="484" width="366" height="88" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="641" y="514" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.8">EVIDENCE</text><text x="641" y="545" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">Behavior and feedback</text><text x="641" y="568" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">activation, retention, qualitative signal</text>
<rect x="1074" y="286" width="390" height="430" rx="26" fill="#191C22" stroke="#292E36" stroke-width="1"/><rect x="1106" y="316" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="1154" y="338" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">POC</text><text x="1106" y="382" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">Feasibility</text><text x="1106" y="420" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="500" text-anchor="start">Can the chosen technical</text><text x="1106" y="446" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">approach work?</text><rect x="1106" y="484" width="326" height="88" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="1130" y="514" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.8">EVIDENCE</text><text x="1130" y="545" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">Technical proof</text><text x="1130" y="568" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">latency, integration, architecture</text>
<rect x="96" y="742" width="1368" height="52" rx="16" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="120" y="775" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start">Rule:</text><text x="175" y="775" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start">do not measure success by how polished the artifact looks; measure whether it reduces the target uncertainty.</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.4">02 / EVIDENCE BEFORE SCALE</text><text x="1504" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>