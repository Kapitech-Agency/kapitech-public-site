<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 740" role="img" aria-labelledby="title desc"><title id="title">What does each approach validate?</title><desc id="desc">Three approaches, three questions, three kinds of evidence.</desc><rect width="1400" height="740" fill="#0B0C0E"/><style>text{font-family:Inter,Arial,sans-serif}</style><text x="70" y="80" font-size="18" letter-spacing="4" fill="#E50914">01 / VALIDATION FOCUS</text><text x="70" y="138" font-size="42" font-weight="700" fill="#F8FAFC">One uncertainty. One primary evidence.</text><g transform="translate(70 210)"><rect width="370" height="375" rx="28" fill="#111318" stroke="#2A2D34"/><text x="30" y="42" font-size="13" fill="#E50914">01</text><text x="30" y="92" font-size="13" letter-spacing="2.2" fill="#69717D">EXPERIENCE</text><text x="30" y="138" font-size="30" font-weight="700" fill="#F8FAFC">PROTOTYPE</text><line x1="30" y1="168" x2="340" y2="168" stroke="#2A2D34"/><text x="30" y="218" font-size="18" font-weight="600" fill="#F8FAFC">Can users use it?</text><text x="30" y="276" font-size="12" letter-spacing="2" fill="#69717D">EVIDENCE</text><text x="30" y="306" font-size="15" fill="#C7CCD5">Flow / usability · comprehension</text><rect x="30" y="350" width="56" height="3" rx="1.5" fill="#E50914"/></g><g transform="translate(515 210)"><rect width="370" height="375" rx="28" fill="#111318" stroke="#2A2D34"/><text x="30" y="42" font-size="13" fill="#E50914">02</text><text x="30" y="92" font-size="13" letter-spacing="2.2" fill="#69717D">VALUE</text><text x="30" y="138" font-size="30" font-weight="700" fill="#F8FAFC">MVP</text><line x1="30" y1="168" x2="340" y2="168" stroke="#2A2D34"/><text x="30" y="218" font-size="18" font-weight="600" fill="#F8FAFC">Will users value it?</text><text x="30" y="276" font-size="12" letter-spacing="2" fill="#69717D">EVIDENCE</text><text x="30" y="306" font-size="15" fill="#C7CCD5">Usage / adoption · learning</text><rect x="30" y="350" width="56" height="3" rx="1.5" fill="#E50914"/></g><g transform="translate(960 210)"><rect width="370" height="375" rx="28" fill="#111318" stroke="#2A2D34"/><text x="30" y="42" font-size="13" fill="#E50914">03</text><text x="30" y="92" font-size="13" letter-spacing="2.2" fill="#69717D">TECHNICAL</text><text x="30" y="138" font-size="30" font-weight="700" fill="#F8FAFC">PoC</text><line x1="30" y1="168" x2="340" y2="168" stroke="#2A2D34"/><text x="30" y="218" font-size="18" font-weight="600" fill="#F8FAFC">Can this approach work?</text><text x="30" y="276" font-size="12" letter-spacing="2" fill="#69717D">EVIDENCE</text><text x="30" y="306" font-size="15" fill="#C7CCD5">Integration / performance · constraints</text><rect x="30" y="350" width="56" height="3" rx="1.5" fill="#E50914"/></g><text x="70" y="670" font-size="16" fill="#69717D">What does each approach validate? — the method follows the question.</text></svg>