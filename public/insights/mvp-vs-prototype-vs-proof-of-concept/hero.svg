<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Prototype, MVP, dan Proof of Concept</title><desc id="desc">Visual tiga pertanyaan validasi.</desc><rect width="1600" height="900" fill="#0B0C0E"/><style>text{font-family:Inter,Arial,sans-serif}</style><g transform="translate(90 82)"><text x="0" font-size="18" letter-spacing="4" fill="#E50914">KAPITECH INSIGHT</text><text x="0" y="70" font-size="54" font-weight="700" fill="#F8FAFC">Mulai dari ketidakpastian.</text><text x="0" y="112" font-size="20" fill="#818996">Bukan ukuran produk. Pertanyaannya yang menentukan alatnya.</text></g>
<g transform="translate(90 245)"><line x1="20" y1="100" x2="1410" y2="100" stroke="#2A2D34" stroke-width="2"/>
<g transform="translate(0 0)"><circle cx="20" cy="100" r="10" fill="#E50914"/><text x="0" y="155" font-size="18" font-weight="700" fill="#F8FAFC">PROTOTYPE</text><text x="0" y="184" font-size="15" fill="#818996">Pengalaman pengguna</text><text x="0" y="216" font-size="16" font-weight="600" fill="#DCE0E8">Apakah alurnya dipahami?</text><path d="M30 100 C130 30 210 30 300 100" fill="none" stroke="#E50914" stroke-width="4"/></g>
<g transform="translate(470 0)"><circle cx="20" cy="100" r="13" fill="#E50914"/><text x="0" y="155" font-size="18" font-weight="700" fill="#F8FAFC">MVP</text><text x="0" y="184" font-size="15" fill="#818996">Nilai produk</text><text x="0" y="216" font-size="16" font-weight="600" fill="#DCE0E8">Apakah pengguna memberi nilai?</text><path d="M30 100 C130 170 210 170 300 100" fill="none" stroke="#E50914" stroke-width="4"/></g>
<g transform="translate(940 0)"><circle cx="20" cy="100" r="10" fill="#E50914"/><text x="0" y="155" font-size="18" font-weight="700" fill="#F8FAFC">PoC</text><text x="0" y="184" font-size="15" fill="#818996">Kelayakan teknis</text><text x="0" y="216" font-size="16" font-weight="600" fill="#DCE0E8">Apakah pendekatannya bisa bekerja?</text><path d="M30 100 C130 30 210 30 300 100" fill="none" stroke="#E50914" stroke-width="4"/></g></g>
<g transform="translate(90 660)"><rect width="1420" height="110" rx="24" fill="#111318" stroke="#2A2D34"/><text x="32" y="43" font-size="14" letter-spacing="2.5" fill="#E50914">MENTAL MODEL</text><text x="32" y="80" font-size="22" font-weight="600" fill="#F8FAFC">Pilih eksperimen terkecil yang bisa menjawab ketidakpastian paling mahal.</text></g></svg>