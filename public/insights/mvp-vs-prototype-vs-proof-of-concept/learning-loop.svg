<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">MVP as a learning loop</title><desc id="desc">A circular path from problem to the next decision.</desc><rect width="1400" height="820" fill="#0B0C0E"/><style>text{font-family:Inter,Arial,sans-serif}</style><text x="70" y="78" font-size="18" letter-spacing="4" fill="#E50914">02 / MVP LOOP</text><text x="70" y="138" font-size="42" font-weight="700" fill="#F8FAFC">Not the smallest product. The smallest viable learning loop.</text><g transform="translate(0 40)"><circle cx="700" cy="450" r="245" fill="none" stroke="#2A2D34" stroke-width="2"/><circle cx="700" cy="450" r="125" fill="#111318" stroke="#E50914" stroke-opacity=".55" stroke-width="2"/><text x="700" y="443" text-anchor="middle" font-size="26" font-weight="700" fill="#F8FAFC">MVP</text><text x="700" y="470" text-anchor="middle" font-size="13" fill="#818996">LEARN</text><g><circle cx="700" cy="260" r="48" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="700" y="265" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Problem</text></g><g><circle cx="1020" cy="400" r="48" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="1020" y="405" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Core solution</text></g><g><circle cx="920" cy="610" r="48" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="920" y="615" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">MVP</text></g><g><circle cx="700" cy="690" r="48" fill="#111318" stroke="#E50914" stroke-width="2"/><text x="700" y="695" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Real users</text></g><g><circle cx="480" cy="610" r="48" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="480" y="615" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Feedback</text></g><g><circle cx="380" cy="400" r="48" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="380" y="405" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Learning</text></g><g><circle cx="600" cy="400" r="48" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="600" y="405" text-anchor="middle" font-size="14" font-weight="600" fill="#F8FAFC">Iteration</text></g><g fill="none" stroke="#E50914" stroke-width="4" stroke-linecap="round"><path d="M735 242 C880 260 960 310 990 352"/><path d="M1052 442 C1040 550 990 594 962 605"/><path d="M880 660 C800 700 760 705 720 704"/><path d="M650 704 C550 700 510 665 470 632"/><path d="M405 594 C360 520 370 470 382 445"/><path d="M430 360 C470 300 525 270 585 255"/><path d="M645 257 C670 250 680 250 690 250"/></g></g><rect x="70" y="720" width="1260" height="64" rx="20" fill="#111318" stroke="#2A2D34"/><text x="100" y="760" font-size="16" fill="#818996">Goal: learn before the next investment decision.</text></svg>