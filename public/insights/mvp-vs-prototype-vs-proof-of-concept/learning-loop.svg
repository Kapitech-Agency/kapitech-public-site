<rect x="260" y="440" width="210" height="110" rx="22"/>
</g>
<g font-size="17" fill="#fff" font-weight="600" text-anchor="middle">
<text x="105" y="55">Problem</text><text x="365" y="55">Core Solution</text><text x="625" y="55">MVP</text>
<text x="235" y="275">Real Users</text><text x="495" y="275">Feedback</text><text x="755" y="275">Learning</text>
<text x="365" y="495">Iteration</text>
