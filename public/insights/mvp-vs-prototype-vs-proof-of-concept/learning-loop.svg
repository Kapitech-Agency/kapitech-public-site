<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">MVP as a learning loop</title><desc id="desc">A simple loop from problem to the next decision.</desc><defs><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171A20"/><stop offset="1" stop-color="#0F1116"/></linearGradient></defs><rect width="1400" height="820" fill="#0B0C0E"/><style>text{font-family:Inter,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}</style><text x="70" y="72" font-size="16" letter-spacing="3.6" fill="#E50914" class="mono">02 / MVP LOOP</text><text x="70" y="122" font-size="38" font-weight="700" fill="#F8FAFC">Not the smallest product. The smallest viable learning loop.</text><circle cx="700" cy="450" r="250" fill="none" stroke="#2A2D34" stroke-width="2"/><path d="M700 200 A250 250 0 0 1 946 494" fill="none" stroke="#E50914" stroke-width="5" stroke-linecap="round"/><circle cx="700" cy="450" r="112" fill="#101217" stroke="#E50914" stroke-opacity=".48" stroke-width="2"/><text x="700" y="442" text-anchor="middle" font-size="30" font-weight="700" fill="#F8FAFC">MVP</text><text x="700" y="470" text-anchor="middle" font-size="11" letter-spacing="2" fill="#7F8795" class="mono">LEARN</text><circle cx="700" cy="235" r="58" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="700" y="213" text-anchor="middle" font-size="10" letter-spacing="1.7" fill="#7F8795" class="mono">01 / PROBLEM</text><text x="700" y="247" text-anchor="middle" font-size="15" font-weight="600" fill="#F8FAFC">Problem</text><circle cx="950" cy="390" r="58" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="950" y="368" text-anchor="middle" font-size="10" letter-spacing="1.7" fill="#7F8795" class="mono">02 / BUILD</text><text x="950" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#F8FAFC">Core solution</text><circle cx="855" cy="630" r="58" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="855" y="608" text-anchor="middle" font-size="10" letter-spacing="1.7" fill="#7F8795" class="mono">03 / TEST</text><text x="855" y="642" text-anchor="middle" font-size="15" font-weight="600" fill="#F8FAFC">Real users</text><circle cx="520" cy="630" r="58" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="520" y="608" text-anchor="middle" font-size="10" letter-spacing="1.7" fill="#7F8795" class="mono">04 / LEARN</text><text x="520" y="642" text-anchor="middle" font-size="15" font-weight="600" fill="#F8FAFC">Feedback</text><circle cx="450" cy="390" r="58" fill="#111318" stroke="#2A2D34" stroke-width="2"/><text x="450" y="368" text-anchor="middle" font-size="10" letter-spacing="1.7" fill="#7F8795" class="mono">05 / DECIDE</text><text x="450" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#F8FAFC">Decision</text><rect x="70" y="720" width="1260" height="56" rx="18" fill="#111318" stroke="#2A2D34"/><text x="100" y="754" font-size="14" fill="#7F8795">Learn before the next investment decision.</text></svg>