<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">MVP learning loop</title><desc id="desc">A product learning loop moves from hypothesis to build, observation, learning, and iteration.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="3.2">MVP MECHANICS</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="start">Build for a learning loop, not a feature list.</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">The MVP is valuable because it creates a repeatable evidence cycle.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="1408" y="110" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">03 / 05</text>
<rect x="96" y="278" width="132" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="162" y="300" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">HYPOTHESIS</text><rect x="450" y="278" width="100" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="500" y="300" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">BUILD</text><rect x="760" y="278" width="112" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="816" y="300" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">OBSERVE</text><rect x="1088" y="278" width="106" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="1141" y="300" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">LEARN</text><rect x="1374" y="278" width="110" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="1429" y="300" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">ADJUST</text>
<path d="M240 296H418" fill="none" stroke="#3B414B" stroke-width="2.5"/><path d="M416 290l10 6 -10 6z" fill="#3B414B"/><path d="M550 296H728" fill="none" stroke="#3B414B" stroke-width="2.5"/><path d="M726 290l10 6 -10 6z" fill="#3B414B"/><path d="M892 296H1056" fill="none" stroke="#3B414B" stroke-width="2.5"/><path d="M1054 290l10 6 -10 6z" fill="#3B414B"/><path d="M1198 296H1344" fill="none" stroke="#3B414B" stroke-width="2.5"/><path d="M1342 290l10 6 -10 6z" fill="#3B414B"/>
<rect x="96" y="352" width="250" height="244" rx="24" fill="#191C22" stroke="#292E36" stroke-width="1"/><text x="124" y="398" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">01</text><text x="124" y="444" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Write the smallest</text><text x="124" y="474" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">testable claim.</text><text x="124" y="520" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">Example</text><text x="124" y="548" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">A team will complete</text><text x="124" y="574" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">the task without help.</text>
<rect x="396" y="352" width="250" height="244" rx="24" fill="#191C22" stroke="#292E36" stroke-width="1"/><text x="424" y="398" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">02</text><text x="424" y="444" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Ship only what is</text><text x="424" y="474" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">needed to test it.</text><text x="424" y="520" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">Constraint</text><text x="424" y="548" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Remove polish that</text><text x="424" y="574" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">does not change learning.</text>
<rect x="696" y="352" width="250" height="244" rx="24" fill="#191C22" stroke="#292E36" stroke-width="1"/><text x="724" y="398" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">03</text><text x="724" y="444" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Observe real</text><text x="724" y="474" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">behavior.</text><text x="724" y="520" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">Signal</text><text x="724" y="548" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Usage, feedback,</text><text x="724" y="574" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">completion, drop-off.</text>
<rect x="996" y="352" width="250" height="244" rx="24" fill="#191C22" stroke="#292E36" stroke-width="1"/><text x="1024" y="398" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">04</text><text x="1024" y="444" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Turn observations</text><text x="1024" y="474" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">into a decision.</text><text x="1024" y="520" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">Decision</text><text x="1024" y="548" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Continue, change,</text><text x="1024" y="574" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">or stop.</text>
<rect x="1296" y="352" width="168" height="244" rx="24" fill="#3A121A" stroke="#DC143C" stroke-width="1.2"/><text x="1324" y="398" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">05</text><text x="1324" y="444" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">Adjust</text><text x="1324" y="474" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start">the next test.</text><text x="1324" y="520" fill="#F0B6C0" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">Focus</text><text x="1324" y="548" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">New risk</text><text x="1324" y="574" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">or stronger evidence.</text>
<rect x="96" y="650" width="1368" height="96" rx="22" fill="#15181D" stroke="#292E36" stroke-width="1"/><text x="124" y="687" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.8">WHY IT WORKS</text><text x="124" y="720" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">A smaller product can be more useful than a larger one when it gives the team a faster, clearer decision.</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.4">03 / EVIDENCE COMPOUNDS THROUGH ITERATION</text><text x="1504" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>