<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">MVP sebagai learning loop minimum yang viable</title>
<desc id="desc">Diagram siklus dari problem, core solution, MVP, real users, feedback, learning, dan iteration.</desc>
<rect width="1400" height="820" fill="#0B0C0E"/>
<g font-family="Inter,Arial,sans-serif">
<text x="80" y="90" font-size="18" letter-spacing="4" fill="#E50914">02 / THE MVP LOOP</text>
<text x="80" y="150" font-size="46" font-weight="700" fill="#F8FAFC">MVP bukan produk terkecil.</text>
<text x="80" y="202" font-size="46" font-weight="700" fill="#F8FAFC">MVP adalah learning loop terkecil yang viable.</text>
<g transform="translate(130 300)">
<g fill="#111318" stroke="#2A2D34">
