<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Prototype, MVP, and proof of concept validation map</title><desc id="desc">Three product validation paths are chosen by the uncertainty the team needs to reduce.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="3.2">PRODUCT VALIDATION</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="start">Choose the instrument for the risk</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Prototype, MVP, and PoC are different tools for different evidence.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="1408" y="110" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">01 / 05</text>
<rect x="96" y="286" width="610" height="444" rx="26" fill="#191C22" stroke="#292E36" stroke-width="1"/><text x="128" y="332" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.2">START HERE</text><text x="128" y="382" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start">What is the most expensive</text><text x="128" y="417" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start">uncertainty right now?</text><rect x="128" y="460" width="250" height="70" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="153" y="489" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">USER EXPERIENCE</text><text x="153" y="516" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">Can users use it?</text><rect x="398" y="460" width="250" height="70" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="423" y="489" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">PRODUCT VALUE</text><text x="423" y="516" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">Will they value it?</text><rect x="128" y="548" width="250" height="70" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="153" y="577" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">TECHNICAL RISK</text><text x="153" y="604" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">Can it work?</text><rect x="398" y="548" width="250" height="70" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="423" y="577" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.3">BUSINESS ASSUMPTION</text><text x="423" y="604" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">What must be true?</text>
<rect x="760" y="286" width="704" height="444" rx="26" fill="#15181D" stroke="#292E36" stroke-width="1"/><text x="796" y="332" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.2">MATCH THE METHOD</text>
<rect x="796" y="366" width="628" height="94" rx="20" fill="#111318" stroke="#292E36" stroke-width="1"/><rect x="822" y="388" width="130" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="887" y="410" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">PROTOTYPE</text><text x="970" y="407" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">High learning / low commitment</text><text x="970" y="433" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Validate flow, hierarchy, interaction.</text>
<rect x="796" y="478" width="628" height="94" rx="20" fill="#111318" stroke="#292E36" stroke-width="1"/><rect x="822" y="500" width="130" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="887" y="522" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">MVP</text><text x="970" y="519" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Real users / real behavior</text><text x="970" y="545" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Validate value with a usable product.</text>
<rect x="796" y="590" width="628" height="94" rx="20" fill="#111318" stroke="#292E36" stroke-width="1"/><rect x="822" y="612" width="130" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="887" y="634" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">POC</text><text x="970" y="631" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Technical proof / constrained scope</text><text x="970" y="657" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Validate feasibility before full build.</text>
