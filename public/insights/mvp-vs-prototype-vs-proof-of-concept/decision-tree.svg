<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Decision tree for prototype MVP or PoC</title><desc id="desc">A decision tree selects the smallest experiment based on the dominant uncertainty.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="3.2">DECISION GUIDE</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="start">Start with the uncertainty that can change the plan.</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Choose the smallest credible experiment that can answer it.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="1408" y="110" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">05 / 05</text>
<rect x="96" y="286" width="360" height="424" rx="26" fill="#191C22" stroke="#292E36" stroke-width="1"/><text x="126" y="330" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">THE QUESTION</text><text x="126" y="380" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">What could make</text><text x="126" y="413" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">the project fail?</text><rect x="126" y="452" width="300" height="76" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="150" y="482" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">USER / UX</text><text x="150" y="510" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">People cannot use it.</text><rect x="126" y="548" width="300" height="76" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="150" y="578" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">VALUE</text><text x="150" y="606" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">People will not value it.</text><rect x="126" y="644" width="300" height="76" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="150" y="674" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">TECHNICAL</text><text x="150" y="702" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">The approach will not work.</text>
<rect x="542" y="300" width="290" height="108" rx="22" fill="#111318" stroke="#292E36" stroke-width="1"/><rect x="566" y="322" width="128" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="630" y="344" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">PROTOTYPE</text><text x="566" y="370" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Test experience.</text>
<rect x="542" y="456" width="290" height="108" rx="22" fill="#111318" stroke="#292E36" stroke-width="1"/><rect x="566" y="478" width="92" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="612" y="500" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">MVP</text><text x="566" y="526" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Test product value.</text>
<rect x="542" y="612" width="290" height="108" rx="22" fill="#111318" stroke="#292E36" stroke-width="1"/><rect x="566" y="634" width="92" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="612" y="656" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">POC</text><text x="566" y="682" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Test feasibility.</text>
<rect x="946" y="300" width="518" height="420" rx="26" fill="#15181D" stroke="#292E36" stroke-width="1"/><text x="978" y="344" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">WHAT YOU SHOULD GET</text><circle cx="982" cy="392" r="7" fill="#DC143C"/><text x="1006" y="398" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">A clear answer to the original question</text><circle cx="982" cy="450" r="7" fill="#3B414B"/><text x="1006" y="456" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">A decision threshold before the test starts</text><circle cx="982" cy="508" r="7" fill="#3B414B"/><text x="1006" y="514" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">Evidence the team can explain to others</text><circle cx="982" cy="566" r="7" fill="#3B414B"/><text x="1006" y="572" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">A next action: continue, change, or stop</text><rect x="978" y="622" width="458" height="64" rx="16" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="1004" y="654" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">Do not let scope become the experiment.</text>
<text x="96" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.4">05 / SMALLEST CREDIBLE EXPERIMENT</text><text x="1504" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>