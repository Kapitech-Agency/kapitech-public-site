<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc"><title id="title">Validation decision framework</title><desc id="desc">Start with the biggest uncertainty, then choose the smallest credible experiment.</desc><rect width="1400" height="1000" fill="#0B0C0E"/><style>text{font-family:Inter,Arial,sans-serif}</style><text x="70" y="78" font-size="18" letter-spacing="4" fill="#E50914">05 / DECISION FRAMEWORK</text><text x="70" y="138" font-size="42" font-weight="700" fill="#F8FAFC">What are you least certain about?</text><g transform="translate(485 190)"><rect width="430" height="100" rx="24" fill="#111318" stroke="#2A2D34"/><text x="215" y="40" text-anchor="middle" font-size="14" fill="#69717D">START HERE</text><text x="215" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#F8FAFC">What are you least certain about?</text></g><g transform="translate(90 390)"><g transform="translate(0 0)"><rect width="350" height="220" rx="24" fill="#111318" stroke="#2A2D34"/><text x="26" y="40" font-size="13" fill="#E50914">01</text><text x="26" y="78" font-size="12" letter-spacing="2" fill="#69717D">EXPERIENCE</text><text x="26" y="128" font-size="29" font-weight="700" fill="#F8FAFC">Prototype</text><text x="26" y="168" font-size="15" fill="#818996">Test flow & usability</text></g><g transform="translate(410 0)"><rect width="350" height="220" rx="24" fill="#111318" stroke="#2A2D34"/><text x="26" y="40" font-size="13" fill="#E50914">02</text><text x="26" y="78" font-size="12" letter-spacing="2" fill="#69717D">VALUE</text><text x="26" y="128" font-size="29" font-weight="700" fill="#F8FAFC">MVP</text><text x="26" y="168" font-size="15" fill="#818996">Test usage & behavior</text></g><g transform="translate(820 0)"><rect width="350" height="220" rx="24" fill="#111318" stroke="#2A2D34"/><text x="26" y="40" font-size="13" fill="#E50914">03</text><text x="26" y="78" font-size="12" letter-spacing="2" fill="#69717D">TECHNICAL</text><text x="26" y="128" font-size="29" font-weight="700" fill="#F8FAFC">PoC</text><text x="26" y="168" font-size="15" fill="#818996">Test feasibility</text></g></g><g stroke="#E50914" stroke-width="4" fill="none"><path d="M700 290 V350 H265 V390"/><path d="M700 350 V390"/><path d="M700 350 H1135 V390"/></g><g fill="#E50914"><path d="M259 380 l6 12 6-12z"/><path d="M694 380 l6 12 6-12z"/><path d="M1129 380 l6 12 6-12z"/></g><rect x="470" y="720" width="460" height="100" rx="24" fill="#E50914" fill-opacity=".075" stroke="#E50914" stroke-opacity=".28"/><text x="700" y="762" text-anchor="middle" font-size="14" letter-spacing="2.2" fill="#E50914">MULTIPLE UNCERTAINTIES</text><text x="700" y="795" text-anchor="middle" font-size="17" fill="#DDE1E8">Combine methods in a focused sequence.</text></svg>