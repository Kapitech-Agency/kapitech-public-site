<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">Kapitech validation framework</title><desc id="desc">Risk to method, evidence, threshold, and decision.</desc><rect width="1400" height="820" fill="#0B0C0E"/><style>text{font-family:Inter,Arial,sans-serif}</style><text x="70" y="78" font-size="18" letter-spacing="4" fill="#E50914">06 / KAPITECH PERSPECTIVE</text><text x="70" y="138" font-size="42" font-weight="700" fill="#F8FAFC">Map risk before the roadmap.</text><g transform="translate(70 235)"><g transform="translate(0 0)"><rect width="200" height="160" rx="22" fill="#111318" stroke="#2A2D34"/><text x="20" y="38" font-size="12" letter-spacing="2" fill="#69717D">RISK</text><text x="20" y="82" font-size="16" font-weight="600" fill="#F8FAFC">What could fail?</text><text x="20" y="122" font-size="12" fill="#818996">Identify</text></g><g transform="translate(250 0)"><rect width="200" height="160" rx="22" fill="#111318" stroke="#2A2D34"/><text x="20" y="38" font-size="12" letter-spacing="2" fill="#69717D">METHOD</text><text x="20" y="82" font-size="16" font-weight="600" fill="#F8FAFC">Prototype / MVP / PoC</text><text x="20" y="122" font-size="12" fill="#818996">Choose</text></g><g transform="translate(500 0)"><rect width="200" height="160" rx="22" fill="#111318" stroke="#2A2D34"/><text x="20" y="38" font-size="12" letter-spacing="2" fill="#69717D">EVIDENCE</text><text x="20" y="82" font-size="16" font-weight="600" fill="#F8FAFC">Observed signal</text><text x="20" y="122" font-size="12" fill="#818996">Observe</text></g><g transform="translate(750 0)"><rect width="200" height="160" rx="22" fill="#111318" stroke="#2A2D34"/><text x="20" y="38" font-size="12" letter-spacing="2" fill="#69717D">THRESHOLD</text><text x="20" y="82" font-size="16" font-weight="600" fill="#F8FAFC">Strong enough?</text><text x="20" y="122" font-size="12" fill="#818996">Assess</text></g><g transform="translate(1000 0)"><rect width="200" height="160" rx="22" fill="#111318" stroke="#E50914"/><text x="20" y="38" font-size="12" letter-spacing="2" fill="#E50914">DECISION</text><text x="20" y="82" font-size="16" font-weight="600" fill="#F8FAFC">Continue / change / stop</text><text x="20" y="122" font-size="12" fill="#818996">Act</text></g><g stroke="#E50914" stroke-width="4"><path d="M200 80 H238"/><path d="M450 80 H488"/><path d="M700 80 H738"/><path d="M950 80 H988"/></g><g fill="#E50914"><path d="M228 74 l10 6 -10 6z"/><path d="M478 74 l10 6 -10 6z"/><path d="M728 74 l10 6 -10 6z"/><path d="M978 74 l10 6 -10 6z"/></g></g><rect x="70" y="475" width="1260" height="170" rx="26" fill="#111318" stroke="#2A2D34"/><text x="104" y="520" font-size="13" letter-spacing="2.4" fill="#E50914">MENTAL MODEL</text><text x="104" y="560" font-size="28" font-weight="700" fill="#F8FAFC">Choose the smallest experiment that still produces credible evidence.</text><text x="104" y="604" font-size="17" fill="#818996">The output is not simply finished work, but a better decision.</text></svg>