<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Kapitech validation framework</title><desc id="desc">Map risk to method, evidence, threshold, and decision.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="3.2">KAPITECH FRAMEWORK</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="start">Risk → method → evidence → decision</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">A practical chain for deciding what to test before committing to a full roadmap.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="1408" y="110" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">FRAMEWORK</text>
<rect x="96" y="302" width="300" height="250" rx="24" fill="#191C22" stroke="#292E36" stroke-width="1"/><rect x="122" y="326" width="118" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="181" y="348" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">01 / RISK</text><text x="122" y="388" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Name the risk</text><text x="122" y="430" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">What could change</text><text x="122" y="456" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">the project decision?</text><text x="122" y="502" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.4">Output</text><text x="122" y="528" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">One testable uncertainty</text>
<rect x="430" y="302" width="300" height="250" rx="24" fill="#191C22" stroke="#292E36" stroke-width="1"/><rect x="456" y="326" width="136" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="524" y="348" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">02 / METHOD</text><text x="456" y="388" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Choose the tool</text><text x="456" y="430" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">Prototype, MVP,</text><text x="456" y="456" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">or PoC based on risk.</text><text x="456" y="502" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.4">Output</text><text x="456" y="528" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Smallest credible test</text>
<rect x="764" y="302" width="300" height="250" rx="24" fill="#191C22" stroke="#292E36" stroke-width="1"/><rect x="790" y="326" width="142" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="861" y="348" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">03 / EVIDENCE</text><text x="790" y="388" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Observe signal</text><text x="790" y="430" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">Collect evidence</text><text x="790" y="456" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">against a threshold.</text><text x="790" y="502" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.4">Output</text><text x="790" y="528" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Decision-quality evidence</text>
<rect x="1098" y="302" width="366" height="250" rx="24" fill="#3A121A" stroke="#DC143C" stroke-width="1.2"/><rect x="1124" y="326" width="150" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="1199" y="348" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">04 / DECISION</text><text x="1124" y="388" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Act on the result</text><text x="1124" y="430" fill="#F0B6C0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Continue, change,</text><text x="1124" y="456" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">or stop the plan.</text><text x="1124" y="502" fill="#F0B6C0" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.4">Output</text><text x="1124" y="528" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">A changed roadmap</text>
<path d="M400 427H416" fill="none" stroke="#3B414B" stroke-width="2.5"/><path d="M414 421l10 6 -10 6z" fill="#3B414B"/><path d="M734 427H750" fill="none" stroke="#3B414B" stroke-width="2.5"/><path d="M748 421l10 6 -10 6z" fill="#3B414B"/><path d="M1068 427H1084" fill="none" stroke="#3B414B" stroke-width="2.5"/><path d="M1082 421l10 6 -10 6z" fill="#3B414B"/>
<rect x="96" y="608" width="1368" height="112" rx="22" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="126" y="644" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">THE STANDARD</text><text x="126" y="680" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start">A good validation artifact is not the one with the most detail. It is the one that changes the next decision.</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.4">FRAMEWORK / VALIDATE BEFORE SCALE</text><text x="1504" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>