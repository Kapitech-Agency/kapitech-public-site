<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Kapitech product validation framework</title>
<desc id="desc">A flow from business risk, user risk, and technical risk to validation method, evidence, and the next decision.</desc>
<rect width="1400" height="820" fill="#0B0C0E"/>
<g font-family="Inter,Arial,sans-serif">
<text x="80" y="84" font-size="18" letter-spacing="4" fill="#E50914">06 / KAPITECH PERSPECTIVE</text>
<text x="80" y="145" font-size="46" font-weight="700" fill="#F8FAFC">Map risk before you map the roadmap.</text>
<g transform="translate(95 245)">
<g fill="#111318" stroke="#2A2D34">
<rect x="0" y="0" width="180" height="120" rx="24"/><rect x="210" y="0" width="180" height="120" rx="24"/><rect x="420" y="0" width="180" height="120" rx="24"/><rect x="630" y="0" width="220" height="120" rx="24"/><rect x="880" y="0" width="180" height="120" rx="24"/><rect x="1090" y="0" width="190" height="120" rx="24"/>
</g>
<g font-size="17" font-weight="700" fill="#fff" text-anchor="middle">
<text x="90" y="50">Business Risk</text><text x="300" y="50">User Risk</text><text x="510" y="50">Technical Risk</text><text x="740" y="50">Validation Method</text><text x="970" y="50">Evidence</text><text x="1185" y="50">Next Decision</text>
</g>
<g font-size="14" fill="#8A909D" text-anchor="middle">
<text x="90" y="78">What must be true?</text><text x="300" y="78">Will users adopt?</text><text x="510" y="78">Can it work?</text><text x="740" y="78">Prototype / PoC / MVP</text><text x="970" y="78">Observed signal</text><text x="1185" y="78">Continue / change / stop</text>
</g>
<path d="M180 60 H205 M390 60 H415 M600 60 H625 M850 60 H875 M1060 60 H1085" stroke="#E50914" stroke-width="4" fill="none"/>
<g fill="#E50914"><path d="M198 54 l8 6 -8 6z"/><path d="M408 54 l8 6 -8 6z"/><path d="M618 54 l8 6 -8 6z"/><path d="M868 54 l8 6 -8 6z"/><path d="M1078 54 l8 6 -8 6z"/></g>
</g>
<g transform="translate(95 470)">
<rect width="1190" height="175" rx="28" fill="#E50914" fill-opacity=".07" stroke="#E50914" stroke-opacity=".25"/>
<text x="35" y="52" font-size="17" letter-spacing="3" fill="#E50914">THE MENTAL MODEL</text>
<text x="35" y="98" font-size="29" font-weight="700" fill="#fff">Choose the smallest thing that can answer your biggest uncertainty.</text>
<text x="35" y="135" font-size="17" fill="#A8AFBB">The output is not “we built it.” The output is “we know more, and we know what to do next.”</text>
</g>
<text x="95" y="720" font-size="17" fill="#69717D">Prototype, MVP, and PoC can be combined when the project carries more than one critical risk.</text>
</g></svg>