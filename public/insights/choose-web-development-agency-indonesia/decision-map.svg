<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Agency shortlist decision process</title><desc id="desc">A shortlist moves through evidence, scope, technical review, and ownership checks.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">DECISION PROCESS</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Turn a shortlist into evidence</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">Each stage should remove a different kind of project risk.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">02 / 06</text><rect x="96" y="300" width="248" height="300" rx="22" fill="#191C22" stroke="#292E36"/><text x="122" y="342" fill="#DC143C" font-family="Inter,Arial" font-size="11" font-weight="700">01 / SHORTLIST</text><text x="122" y="388" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Relevant portfolio</text><text x="122" y="426" fill="#8B94A1" font-family="Inter,Arial" font-size="15">Similar problem</text><text x="122" y="500" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700">RISK REMOVED</text><text x="122" y="530" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Fit</text><rect x="372" y="300" width="248" height="300" rx="22" fill="#15181D" stroke="#292E36"/><text x="398" y="342" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">02 / VERIFY</text><text x="398" y="388" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Actual project role</text><text x="398" y="426" fill="#8B94A1" font-family="Inter,Arial" font-size="15">Client reference</text><text x="398" y="500" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700">RISK REMOVED</text><text x="398" y="530" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Claims</text><rect x="648" y="300" width="248" height="300" rx="22" fill="#15181D" stroke="#292E36"/><text x="674" y="342" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">03 / SCOPE</text><text x="674" y="388" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Measurable scope</text><text x="674" y="426" fill="#8B94A1" font-family="Inter,Arial" font-size="15">Clear exclusions</text><text x="674" y="500" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700">RISK REMOVED</text><text x="674" y="530" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Ambiguity</text><rect x="924" y="300" width="248" height="300" rx="22" fill="#15181D" stroke="#292E36"/><text x="950" y="342" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">04 / TEST</text><text x="950" y="388" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Technical fit</text><text x="950" y="426" fill="#8B94A1" font-family="Inter,Arial" font-size="15">QA / acceptance</text><text x="950" y="500" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700">RISK REMOVED</text><text x="950" y="530" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Delivery</text><rect x="1200" y="300" width="264" height="300" rx="22" fill="#3A121A" stroke="#DC143C"/><text x="1226" y="342" fill="#F0B6C0" font-family="Inter,Arial" font-size="11" font-weight="700">05 / CONTRACT</text><text x="1226" y="388" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Ownership terms</text><text x="1226" y="426" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">Support boundaries</text><text x="1226" y="500" fill="#F0B6C0" font-family="Inter,Arial" font-size="12" font-weight="700">RISK REMOVED</text><text x="1226" y="530" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Commercial</text><rect x="96" y="638" width="1368" height="64" rx="18" fill="#111318" stroke="#292E36"/><text x="124" y="678" fill="#F5F7FA" font-family="Inter,Arial" font-size="15" font-weight="700">Rule:</text><text x="180" y="678" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">do not ask an agency to prove everything. Ask each stage to prove the next decision.</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">02 / SHORTLIST BY EVIDENCE, NOT STYLE</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>