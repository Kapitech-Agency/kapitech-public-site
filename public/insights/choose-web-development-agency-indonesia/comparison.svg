<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Web agency comparison scorecard</title><desc id="desc">A structured scorecard compares agencies on evidence, process, technical approach, QA, ownership, and support.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">COMPARISON</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Compare agencies on proof, not presentation</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">Use the same questions for every shortlisted partner.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">04 / 06</text><rect x="96" y="286" width="1368" height="56" rx="15" fill="#20252D" stroke="#292E36"/><text x="118" y="320" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">CRITERION</text><text x="520" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">AGENCY A</text><text x="832" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">AGENCY B</text><text x="1144" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">EVIDENCE TO REQUEST</text><g font-family="Inter,Arial"><rect x="96" y="342" width="1368" height="64" rx="14" fill="#191C22" stroke="#292E36"/><text x="118" y="382" fill="#D9DEE6" font-size="15" font-weight="600">Relevant portfolio</text><rect x="520" y="357" width="92" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="566" y="379" text-anchor="middle" fill="#F5F7FA" font-size="12" font-weight="700">CLEAR</text><rect x="832" y="357" width="92" height="34" rx="17" fill="#20252D" stroke="#292E36"/><text x="878" y="379" text-anchor="middle" fill="#8B94A1" font-size="12" font-weight="700">CHECK</text><text x="1144" y="382" fill="#8B94A1" font-size="14">Case study + result</text><rect x="96" y="406" width="1368" height="64" rx="14" fill="#15181D" stroke="#292E36"/><text x="118" y="446" fill="#D9DEE6" font-size="15" font-weight="600">Actual project role</text><rect x="520" y="421" width="92" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="566" y="443" text-anchor="middle" fill="#F5F7FA" font-size="12" font-weight="700">CLEAR</text><rect x="832" y="421" width="92" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="878" y="443" text-anchor="middle" fill="#F5F7FA" font-size="12" font-weight="700">CLEAR</text><text x="1144" y="446" fill="#8B94A1" font-size="14">Named responsibilities</text><rect x="96" y="470" width="1368" height="64" rx="14" fill="#191C22" stroke="#292E36"/><text x="118" y="510" fill="#D9DEE6" font-size="15" font-weight="600">Technical approach</text><rect x="520" y="485" width="92" height="34" rx="17" fill="#20252D" stroke="#292E36"/><text x="566" y="507" text-anchor="middle" fill="#8B94A1" font-size="12" font-weight="700">CHECK</text><rect x="832" y="485" width="92" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="878" y="507" text-anchor="middle" fill="#F5F7FA" font-size="12" font-weight="700">CLEAR</text><text x="1144" y="510" fill="#8B94A1" font-size="14">Stack + trade-offs</text><rect x="96" y="534" width="1368" height="64" rx="14" fill="#15181D" stroke="#292E36"/><text x="118" y="574" fill="#D9DEE6" font-size="15" font-weight="600">QA / launch</text><rect x="520" y="549" width="92" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="566" y="571" text-anchor="middle" fill="#F5F7FA" font-size="12" font-weight="700">CLEAR</text><rect x="832" y="549" width="92" height="34" rx="17" fill="#20252D" stroke="#292E3