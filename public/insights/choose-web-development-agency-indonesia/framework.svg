<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Web agency selection framework</title><desc id="desc">Six checks assess an agency from business fit and relevant proof through process, technical fit, ownership, and support.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">FRAMEWORK</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Score the agency like a delivery system</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">A partner decision should survive beyond the pitch deck.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">06 / 06</text><rect x="96" y="296" width="420" height="158" rx="22" fill="#191C22" stroke="#292E36"/><text x="122" y="334" fill="#DC143C" font-family="Inter,Arial" font-size="11" font-weight="700">01 / BUSINESS FIT</text><text x="122" y="374" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">Outcome + audience</text><text x="122" y="414" fill="#8B94A1" font-family="Inter,Arial" font-size="14">Does the agency understand the job?</text><rect x="560" y="296" width="420" height="158" rx="22" fill="#15181D" stroke="#292E36"/><text x="586" y="334" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">02 / RELEVANT PROOF</text><text x="586" y="374" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">Comparable projects</text><text x="586" y="414" fill="#8B94A1" font-family="Inter,Arial" font-size="14">Can the evidence match your problem?</text><rect x="1024" y="296" width="440" height="158" rx="22" fill="#191C22" stroke="#292E36"/><text x="1050" y="334" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">03 / PROCESS</text><text x="1050" y="374" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">Discovery to QA</text><text x="1050" y="414" fill="#8B94A1" font-family="Inter,Arial" font-size="14">Is delivery explainable?</text><rect x="96" y="484" width="420" height="158" rx="22" fill="#15181D" stroke="#292E36"/><text x="122" y="522" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">04 / TECHNICAL FIT</text><text x="122" y="562" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">Architecture + integrations</text><text x="122" y="602" fill="#8B94A1" font-family="Inter,Arial" font-size="14">Do technical choices match the requirements?</text><rect x="560" y="484" width="420" height="158" rx="22" fill="#15181D" stroke="#292E36"/><text x="586" y="522" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">05 / OWNERSHIP</text><text x="586" y="562" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">Access + source</text><text x="586" y="602" fill="#8B94A1" font-family="Inter,Arial" font-size="14">Who controls the assets after launch?</text><rect x="1024" y="484" width="440" height="158" rx="22" fill="#3A121A" stroke="#DC143C"/><text x="1050" y="522" fill="#F0B6C0" font-family="Inter,Arial" font-size="11" font-weight="700">06 / SUPPORT</text><text x="1050" y="562" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">Response + maintenance</text><text x="1050" y="602" fill="#F0B6C0" font-family="Inter,Arial" font-size="14">What happens after launch?</text><rect x="96" y="688" width="1368" height="58" rx="16" fill="#111318" stroke="#292E36"/><text x="122" y="724" fill="#F5F7FA" font-family="Inter,Arial" font-size="15" font-weight="700">Best partner: the one that can explain its trade-offs, prove delivery, and leave the client in control.</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">06 / FIT + PROOF + OWNERSHIP</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>