<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Web agency due diligence scenario</title><desc id="desc">Two agency profiles are compared by evidence, process, technical fit, and ownership before selection.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">SCENARIO</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">A practical agency due-diligence pass</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">The decision gets easier when every agency answers the same questions.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">05 / 06</text><rect x="96" y="294" width="390" height="420" rx="24" fill="#191C22" stroke="#292E36"/><rect x="126" y="320" width="106" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="179" y="342" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">AGENCY A</text><text x="126" y="378" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">Beautiful portfolio</text><circle cx="132" cy="430" r="7" fill="#DC143C"/><text x="154" y="436" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Strong visuals</text><circle cx="132" cy="474" r="7" fill="#3B414B"/><text x="154" y="480" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Unclear project role</text><circle cx="132" cy="518" r="7" fill="#3B414B"/><text x="154" y="524" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Vague support</text><rect x="126" y="608" width="136" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="194" y="630" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">DO NOT ASSUME</text><rect x="534" y="294" width="390" height="420" rx="24" fill="#15181D" stroke="#292E36"/><rect x="564" y="320" width="106" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="617" y="342" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">AGENCY B</text><text x="564" y="378" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">Relevant case study</text><circle cx="570" cy="430" r="7" fill="#DC143C"/><text x="592" y="436" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Clear process</text><circle cx="570" cy="474" r="7" fill="#3B414B"/><text x="592" y="480" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Technology explained</text><circle cx="570" cy="518" r="7" fill="#3B414B"/><text x="592" y="524" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Ownership documented</text><rect x="564" y="608" width="86" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="607" y="630" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">VERIFY</text><rect x="972" y="294" width="492" height="420" rx="24" fill="#3A121A" stroke="#DC143C"/><text x="1002" y="340" fill="#F0B6C0" font-family="Inter,Arial" font-size="12" font-weight="700">DECISION</text><text x="1002" y="386" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">Choose evidence</text><text x="1002" y="430" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">Portfolio</text><text x="1002" y="466" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">Process</text><text x="1002" y="502" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">Technical fit</text><text x="1002" y="538" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">Ownership + support</text><rect x="1002" y="570" width="432" height="84" rx="18" fill="#111318" stroke="#292E36"/><text x="1026" y="600" fill="#626B78" font-family="Inter,Arial" font-size="11" font-weight="700">WHY</text><text x="1026" y="629" fill="#F5F7FA" font-family="Inter,Arial" font-size="17" font-weight="700">Evidence reduces project risk.</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">05 / CHOOSE THE PARTNER YOU CAN VERIFY</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>