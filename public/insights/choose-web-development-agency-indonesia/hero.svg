<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Web development agency selection scorecard</title><desc id="desc">Four evidence areas help evaluate an agency: portfolio proof, process, technical capability, and ownership.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">AGENCY SELECTION</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Evaluate the system behind the screenshots</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">A polished homepage is not enough evidence for a high-stakes web project.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">01 / 06</text><rect x="96" y="292" width="310" height="404" rx="24" fill="#191C22" stroke="#292E36"/><text x="122" y="334" fill="#DC143C" font-family="Inter,Arial" font-size="11" font-weight="700">01</text><text x="122" y="378" fill="#F5F7FA" font-family="Inter,Arial" font-size="21" font-weight="700">EVIDENCE</text><text x="122" y="420" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Relevant case studies</text><text x="122" y="454" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Clear project role</text><text x="122" y="488" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Comparable outcomes</text><rect x="122" y="584" width="88" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="166" y="606" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">VERIFY</text><rect x="444" y="292" width="310" height="404" rx="24" fill="#15181D" stroke="#292E36"/><text x="470" y="334" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">02</text><text x="470" y="378" fill="#F5F7FA" font-family="Inter,Arial" font-size="21" font-weight="700">PROCESS</text><text x="470" y="420" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Discovery</text><text x="470" y="454" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">UX / UI</text><text x="470" y="488" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Engineering + QA</text><rect x="470" y="584" width="96" height="34" rx="17" fill="#20252D" stroke="#292E36"/><text x="518" y="606" text-anchor="middle" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">INSPECT</text><rect x="792" y="292" width="310" height="404" rx="24" fill="#15181D" stroke="#292E36"/><text x="818" y="334" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">03</text><text x="818" y="378" fill="#F5F7FA" font-family="Inter,Arial" font-size="21" font-weight="700">TECHNICAL</text><text x="818" y="420" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Architecture</text><text x="818" y="454" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Integrations</text><text x="818" y="488" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Performance + security</text><rect x="818" y="584" width="82" height="34" rx="17" fill="#20252D" stroke="#292E36"/><text x="859" y="606" text-anchor="middle" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">TEST</text><rect x="1140" y="292" width="324" height="404" rx="24" fill="#3A121A" stroke="#DC143C"/><text x="1166" y="334" fill="#F0B6C0" font-family="Inter,Arial" font-size="11" font-weight="700">04</text><text x="1166" y="378" fill="#F5F7FA" font-family="Inter,Arial" font-size="21" font-weight="700">OWNERSHIP</text><text x="1166" y="420" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">Source + design files</text><text x="1166" y="454" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">Access + domains</text><text x="1166" y="488" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">Support boundaries</text><rect x="1166" y="584" width="108" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1220" y="606" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">CONTRACT</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">01 / INSPECT THE DELIVERY SYSTEM</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>