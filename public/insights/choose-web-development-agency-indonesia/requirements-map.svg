<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Web development agency proposal anatomy</title><desc id="desc">A proposal should expose business outcome, scope, responsibilities, technology, QA, and handover.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">PROPOSAL REVIEW</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Make the proposal measurable</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">The best proposal reduces ambiguity before development starts.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">03 / 06</text><rect x="96" y="294" width="648" height="104" rx="18" fill="#191C22" stroke="#292E36"/><text x="122" y="336" fill="#DC143C" font-family="Inter,Arial" font-size="11" font-weight="700">01 / BUSINESS OUTCOME</text><text x="122" y="374" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">What changes for the business?</text><rect x="816" y="294" width="648" height="104" rx="18" fill="#15181D" stroke="#292E36"/><text x="842" y="336" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">02 / SCOPE</text><text x="842" y="374" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Pages, features, exclusions</text><rect x="96" y="418" width="648" height="104" rx="18" fill="#15181D" stroke="#292E36"/><text x="122" y="460" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">03 / RESPONSIBILITIES</text><text x="122" y="498" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Who decides, writes, builds?</text><rect x="816" y="418" width="648" height="104" rx="18" fill="#191C22" stroke="#292E36"/><text x="842" y="460" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">04 / TECHNICAL PLAN</text><text x="842" y="498" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Architecture, integrations, constraints</text><rect x="96" y="542" width="648" height="104" rx="18" fill="#15181D" stroke="#292E36"/><text x="122" y="584" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">05 / QA + ACCEPTANCE</text><text x="122" y="622" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Test cases, acceptance, launch</text><rect x="816" y="542" width="648" height="104" rx="18" fill="#3A121A" stroke="#DC143C"/><text x="842" y="584" fill="#F0B6C0" font-family="Inter,Arial" font-size="11" font-weight="700">06 / HANDOVER</text><text x="842" y="622" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">Files, access, credentials, support</text><rect x="96" y="680" width="1368" height="68" rx="18" fill="#111318" stroke="#292E36"/><text x="124" y="722" fill="#F5F7FA" font-family="Inter,Arial" font-size="15" font-weight="700">A proposal should make it possible to understand what is being bought without the salesperson in the room.</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">03 / SCOPE SHOULD SURVIVE HANDOVER</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>