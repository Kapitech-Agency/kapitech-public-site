<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">WordPress versus custom decision map</title><desc id="desc">Editing, integrations, change complexity, and ownership guide platform selection.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">DECISION MAP</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Four questions narrow the choice</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">Start with how the team will operate the website.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">02 / 06</text><rect x="96" y="294" width="304" height="416" rx="24" fill="#191C22" stroke="#292E36"/><text x="124" y="336" fill="#DC143C" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="1.7">01 / EDITING</text><text x="124" y="386" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">Who changes</text><text x="124" y="418" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">the content?</text><text x="124" y="472" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Frequent editors</text><text x="124" y="512" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Approval workflow</text><text x="124" y="552" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Structured publishing</text><text x="124" y="592" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Small technical team</text><rect x="436" y="294" width="304" height="416" rx="24" fill="#15181D" stroke="#292E36"/><text x="464" y="336" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="1.7">02 / INTEGRATION</text><text x="464" y="386" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">What must</text><text x="464" y="418" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">the site connect to?</text><text x="464" y="472" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">CRM / APIs</text><text x="464" y="512" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Payments / data</text><text x="464" y="552" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Internal tools</text><text x="464" y="592" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Custom auth</text><rect x="776" y="294" width="304" height="416" rx="24" fill="#15181D" stroke="#292E36"/><text x="804" y="336" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="1.7">03 / CHANGE</text><text x="804" y="386" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">How much UI logic</text><text x="804" y="418" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">will change?</text><text x="804" y="472" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Standard patterns</text><text x="804" y="512" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Unique interactions</text><text x="804" y="552" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Product-like flows</text><text x="804" y="592" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Complex business rules</text><rect x="1116" y="294" width="348" height="416" rx="24" fill="#3A121A" stroke="#DC143C"/><text x="1144" y="336" fill="#F0B6C0" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="1.7">04 / FIT</text><text x="1144" y="386" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">Choose the model</text><rect x="1144" y="420" width="292" height="74" rx="17" fill="#111318" stroke="#292E36"/><text x="1168" y="449" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="700">WordPress</text><text x="1168" y="477" fill="#8B94A1" font-family="Inter,Arial" font-size="13">Publishing is the main job</text><rect x="1144" y="514" width="292" height="74" rx="17" fill="#111318" stroke="#292E36"/><text x="1168" y="543" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="700">Custom</text><text x="1168" y="571" fill="#8B94A1" font-family="Inter,Arial" font-size="13">Workflow is the product</text><text x="1144" y="634" fill="#F0B6C0" font-family="Inter,Arial" font-size="14" font-weight="700">FIT BEATS PREFERENCE</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">02 / START WITH THE OPERATING MODEL</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>