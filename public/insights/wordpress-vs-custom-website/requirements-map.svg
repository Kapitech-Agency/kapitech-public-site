<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">WordPress and custom architecture layers</title><desc id="desc">Editorial, presentation, business logic, integrations, and operations can be implemented differently.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">ARCHITECTURE</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Compare the layers, not the labels</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">Map the same business requirement to each option before choosing a stack.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">03 / 06</text><rect x="96" y="286" width="1368" height="56" rx="15" fill="#20252D" stroke="#292E36"/><text x="118" y="320" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">LAYER</text><text x="470" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">WORDPRESS</text><text x="918" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">CUSTOM</text><text x="1216" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">WATCH FOR</text><g font-family="Inter,Arial"><rect x="96" y="342" width="1368" height="76" rx="15" fill="#191C22" stroke="#292E36"/><text x="118" y="387" fill="#D9DEE6" font-size="15" font-weight="600">Editorial</text><text x="470" y="387" fill="#8B94A1" font-size="14">CMS + plugins</text><text x="918" y="387" fill="#D9DEE6" font-size="14">Tailored app</text><text x="1216" y="387" fill="#626B78" font-size="13">editor workflow</text><rect x="96" y="418" width="1368" height="76" rx="15" fill="#15181D" stroke="#292E36"/><text x="118" y="463" fill="#D9DEE6" font-size="15" font-weight="600">UI + components</text><text x="470" y="463" fill="#8B94A1" font-size="14">Theme + blocks</text><text x="918" y="463" fill="#D9DEE6" font-size="14">Design system</text><text x="1216" y="463" fill="#626B78" font-size="13">interaction control</text><rect x="96" y="494" width="1368" height="76" rx="15" fill="#191C22" stroke="#292E36"/><text x="118" y="539" fill="#D9DEE6" font-size="15" font-weight="600">Business logic</text><text x="470" y="539" fill="#8B94A1" font-size="14">Plugin / hooks</text><text x="918" y="539" fill="#D9DEE6" font-size="14">Server logic</text><text x="1216" y="539" fill="#626B78" font-size="13">rule complexity</text><rect x="96" y="570" width="1368" height="76" rx="15" fill="#15181D" stroke="#292E36"/><text x="118" y="615" fill="#D9DEE6" font-size="15" font-weight="600">Integrations</text><text x="470" y="615" fill="#8B94A1" font-size="14">Plugin / API</text><text x="918" y="615" fill="#D9DEE6" font-size="14">Native integration layer</text><text x="1216" y="615" fill="#626B78" font-size="13">dependency depth</text><rect x="96" y="646" width="1368" height="76" rx="15" fill="#3A121A" stroke="#DC143C"/><text x="118" y="691" fill="#F5F7FA" font-size="15" font-weight="600">Operations</text><text x="470" y="691" fill="#F0B6C0" font-size="14">Updates + hosting</text><text x="918" y="691" fill="#F5F7FA" font-size="14">CI/CD + observability</text><text x="1216" y="691" fill="#F0B6C0" font-size="13">team capability</text></g><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">03 / ARCHITECTURE IS AN OPERATING CHOICE</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>