<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">WordPress and custom platform scenarios</title><desc id="desc">A publishing-led company and a workflow-led company can need different platform choices.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">SCENARIOS</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Same business type, different operating need</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">The platform can change when content publishing becomes a product workflow.</text><rect x="96" y="294" width="620" height="414" rx="24" fill="#191C22" stroke="#292E36"/><rect x="126" y="320" width="126" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="189" y="342" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">SCENARIO A</text><text x="126" y="390" fill="#F5F7FA" font-family="Inter,Arial" font-size="23" font-weight="700">Corporate publishing</text><text x="126" y="426" fill="#8B94A1" font-family="Inter,Arial" font-size="15">Frequent updates • multiple editors</text><rect x="126" y="462" width="560" height="68" rx="16" fill="#111318" stroke="#292E36"/><text x="150" y="491" fill="#626B78" font-family="Inter,Arial" font-size="11" font-weight="700">NEED</text><text x="150" y="516" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="600">CMS + pages + media + standard forms</text><rect x="126" y="548" width="560" height="68" rx="16" fill="#111318" stroke="#292E36"/><text x="150" y="577" fill="#626B78" font-family="Inter,Arial" font-size="11" font-weight="700">LIKELY FIT</text><text x="150" y="602" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="600">WordPress with a controlled design system</text><rect x="126" y="634" width="128" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="190" y="656" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">PUBLISHING</text><rect x="758" y="294" width="706" height="414" rx="24" fill="#3A121A" stroke="#DC143C"/><rect x="788" y="320" width="126" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="851" y="342" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">SCENARIO B</text><text x="788" y="390" fill="#F5F7FA" font-family="Inter,Arial" font-size="23" font-weight="700">Business workflow</text><text x="788" y="426" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">Complex rules • custom integrations</text><rect x="788" y="462" width="646" height="68" rx="16" fill="#111318" stroke="#292E36"/><text x="812" y="491" fill="#626B78" font-family="Inter,Arial" font-size="11" font-weight="700">NEED</text><text x="812" y="516" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="600">Accounts + approvals + API + custom UI</text><rect x="788" y="548" width="646" height="68" rx="16" fill="#111318" stroke="#292E36"/><text x="812" y="577" fill="#626B78" font-family="Inter,Arial" font-size="11" font-weight="700">LIKELY FIT</text><text x="812" y="602" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="600">Custom application architecture</text><rect x="788" y="634" width="118" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="847" y="656" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">WORKFLOW</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">05 / SAME COMPANY, DIFFERENT PLATFORM FIT</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>