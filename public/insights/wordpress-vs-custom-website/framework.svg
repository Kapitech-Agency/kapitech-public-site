<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Platform selection framework</title><desc id="desc">Six checks evaluate platform fit across content, interface control, integrations, ownership, operations, and future change.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">FRAMEWORK</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Six checks before you choose</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">Use this with the people who will edit, build, and maintain the website.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">06 / 06</text><rect x="96" y="292" width="430" height="160" rx="22" fill="#191C22" stroke="#292E36"/><text x="122" y="330" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">01 / CONTENT</text><text x="122" y="370" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">How often will content change?</text><text x="122" y="410" fill="#8B94A1" font-family="Inter,Arial" font-size="14">Frequent publishing favors editorial simplicity.</text><rect x="585" y="292" width="430" height="160" rx="22" fill="#15181D" stroke="#292E36"/><text x="611" y="330" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">02 / UX CONTROL</text><text x="611" y="370" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">How unique is the interface?</text><text x="611" y="410" fill="#8B94A1" font-family="Inter,Arial" font-size="14">Product-like interaction can shift the trade-off.</text><rect x="1074" y="292" width="390" height="160" rx="22" fill="#191C22" stroke="#292E36"/><text x="1100" y="330" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">03 / INTEGRATIONS</text><text x="1100" y="370" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">How deep are the connections?</text><text x="1100" y="410" fill="#8B94A1" font-family="Inter,Arial" font-size="14">API depth and data rules matter.</text><rect x="96" y="482" width="430" height="160" rx="22" fill="#15181D" stroke="#292E36"/><text x="122" y="520" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">04 / OWNERSHIP</text><text x="122" y="560" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">Who controls source and access?</text><text x="122" y="600" fill="#8B94A1" font-family="Inter,Arial" font-size="14">Clarify domains, code, hosting, and CMS.</text><rect x="585" y="482" width="430" height="160" rx="22" fill="#15181D" stroke="#292E36"/><text x="611" y="520" fill="#8B94A1" font-family="Inter,Arial" font-size="11" font-weight="700">05 / OPS TEAM</text><text x="611" y="560" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">Who will maintain it?</text><text x="611" y="600" fill="#8B94A1" font-family="Inter,Arial" font-size="14">The easiest stack to operate often wins.</text><rect x="1074" y="482" width="390" height="160" rx="22" fill="#3A121A" stroke="#DC143C"/><text x="1100" y="520" fill="#F0B6C0" font-family="Inter,Arial" font-size="11" font-weight="700">06 / FUTURE CHANGE</text><text x="1100" y="560" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">What changes next?</text><text x="1100" y="600" fill="#F0B6C0" font-family="Inter,Arial" font-size="14">Choose for the next stage, not only today.</text><rect x="96" y="688" width="1368" height="58" rx="16" fill="#111318" stroke="#292E36"/><text x="122" y="724" fill="#F5F7FA" font-family="Inter,Arial" font-size="15" font-weight="700">Choose the lowest-complexity option that still meets the real requirements.</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">06 / PLATFORM FIT IS A BUSINESS DECISION</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>