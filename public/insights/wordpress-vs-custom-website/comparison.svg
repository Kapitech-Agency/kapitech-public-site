<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">WordPress custom website comparison</title><desc id="desc">Comparison across publishing speed, flexibility, integrations, maintenance, ownership, and total cost.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">COMPARISON</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">WordPress vs custom website</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">Neither option wins every row. Fit depends on the business requirement.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">04 / 06</text><rect x="96" y="286" width="1368" height="56" rx="15" fill="#20252D" stroke="#292E36"/><text x="118" y="320" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">FACTOR</text><text x="520" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">WORDPRESS</text><text x="900" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">CUSTOM</text><text x="1218" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">WATCH FOR</text><g font-family="Inter,Arial"><rect x="96" y="342" width="1368" height="66" rx="14" fill="#191C22" stroke="#292E36"/><text x="118" y="383" fill="#D9DEE6" font-size="15" font-weight="600">Publishing speed</text><text x="520" y="383" fill="#D9DEE6" font-size="14">Strong</text><text x="900" y="383" fill="#D9DEE6" font-size="14">Scope-dependent</text><text x="1218" y="383" fill="#8B94A1" font-size="14">Editor workflow</text><rect x="96" y="408" width="1368" height="66" rx="14" fill="#15181D" stroke="#292E36"/><text x="118" y="449" fill="#D9DEE6" font-size="15" font-weight="600">Flexibility</text><text x="520" y="449" fill="#D9DEE6" font-size="14">High</text><text x="900" y="449" fill="#D9DEE6" font-size="14">High control</text><text x="1218" y="449" fill="#8B94A1" font-size="14">Unique UI</text><rect x="96" y="474" width="1368" height="66" rx="14" fill="#191C22" stroke="#292E36"/><text x="118" y="515" fill="#D9DEE6" font-size="15" font-weight="600">Integrations</text><text x="520" y="515" fill="#D9DEE6" font-size="14">Plugin / API</text><text x="900" y="515" fill="#D9DEE6" font-size="14">High control</text><text x="1218" y="515" fill="#8B94A1" font-size="14">API / data rules</text><rect x="96" y="540" width="1368" height="66" rx="14" fill="#15181D" stroke="#292E36"/><text x="118" y="581" fill="#D9DEE6" font-size="15" font-weight="600">Maintenance</text><text x="520" y="581" fill="#D9DEE6" font-size="14">Update cadence</text><text x="900" y="581" fill="#D9DEE6" font-size="14">Engineering-led</text><text x="1218" y="581" fill="#8B94A1" font-size="14">Operational skill</text><rect x="96" y="606" width="1368" height="66" rx="14" fill="#191C22" stroke="#292E36"/><text x="118" y="647" fill="#D9DEE6" font-size="15" font-weight="600">Ownership</text><text x="520" y="647" fill="#D9DEE6" font-size="14">Plugin / host stack</text><text x="900" y="647" fill="#D9DEE6" font-size="14">Deeper control</text><text x="1218" y="647" fill="#8B94A1" font-size="14">Access + source</text><rect x="96" y="672" width="1368" height="66" rx="14" fill="#3A121A" stroke="#DC143C"/><text x="118" y="713" fill="#F5F7FA" font-size="15" font-weight="600">Total cost</text><text x="520" y="713" fill="#F0B6C0" font-size="14">Scope-dependent</text><text x="900" y="713" fill="#F5F7FA" font-size="14">Scope + operating cost</text><text x="1218" y="713" fill="#F0B6C0" font-size="14">Long-term effort</text></g><text x="