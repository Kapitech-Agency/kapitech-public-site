<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Website cost decision model</title><desc id="desc">Website budget is shaped by scope, complexity, integrations, design, and ownership.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="3.2">WEBSITE COST</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="start">What actually changes the budget?</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">A website is not priced by page count alone. The work behind each page matters.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="1408" y="110" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">01 / 06</text><rect x="96" y="286" width="560" height="434" rx="26" fill="#191C22" stroke="#292E36" stroke-width="1"/><text x="126" y="328" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">BUDGET INPUTS</text><rect x="126" y="356" width="102" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="177" y="378" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">SCOPE</text><rect x="246" y="356" width="106" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="299" y="378" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">DESIGN</text><rect x="368" y="356" width="116" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="426" y="378" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">CONTENT</text><rect x="500" y="356" width="136" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="568" y="378" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">INTEGRATION</text><rect x="126" y="412" width="82" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="167" y="434" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">QA</text><rect x="224" y="412" width="108" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="278" y="434" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">SUPPORT</text><text x="126" y="480" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">Think in work packages</text><text x="126" y="520" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">Page templates + content model + integrations</text><text x="126" y="548" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">+ responsive behavior + QA + launch + ownership</text><rect x="126" y="588" width="480" height="88" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="150" y="618" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.6">OUTPUT</text><text x="150" y="648" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start">A comparable project scope</text><rect x="710" y="286" width="754" height="434" rx="26" fill="#15181D" stroke="#292E36" stroke-width="1"/><text x="742" y="328" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">COST MODEL</text><rect x="742" y="360" width="680" height="82" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="770" y="392" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2">01</text><text x="820" y="394" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Business job</text><text x="770" y="422" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Credibility • leads • publishing • commerce • workflow</text><rect x="742" y="460" width="680" height="82" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="770" y="492" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2">02</text><text x="820" y="494" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Complexity</text><text x="770" y="522" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">Custom interactions • data • integrations • approvals</text><rect x="742" y="560" width="680" height="82" rx="18" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="770" y="592" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2">03</text><text x="820" y="594" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Ownership after launch</text><text x="770" y="622" fill="#F0B6C0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" text-anchor="start">CMS • source • hosting • analytics • maintenance</text> <text x="96" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.4">01 / BUDGET FOLLOWS THE WORK</text><text x="1504" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>