<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Website budget decision map</title><desc id="desc">A decision map shows how business purpose and complexity influence website scope.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="3.2">BUDGET PLANNING</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700" text-anchor="start">Build the scope before you price it</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start">Start with the business job, then test the requirements that change effort.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="1408" y="110" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">02 / 06</text><rect x="96" y="304" width="280" height="396" rx="24" fill="#191C22" stroke="#292E36" stroke-width="1"/><rect x="122" y="328" width="92" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="168" y="350" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">START</text><text x="122" y="386" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">What must the</text><text x="122" y="418" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">website do?</text><text x="122" y="468" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">Choose the job</text><text x="122" y="500" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Generate demand</text><text x="122" y="532" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Explain services</text><text x="122" y="564" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Publish content</text><text x="122" y="596" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start">Sell or self-serve</text><rect x="438" y="304" width="320" height="396" rx="24" fill="#15181D" stroke="#292E36" stroke-width="1"/><rect x="466" y="328" width="98" height="34" rx="17" fill="#20252D" stroke="#292E36" stroke-width="1"/><text x="515" y="350" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">SCOPE</text><text x="466" y="388" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">What changes</text><text x="466" y="422" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" text-anchor="start">the amount of work?</text><text x="466" y="468" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Content volume</text><text x="466" y="508" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Custom UI patterns</text><text x="466" y="548" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Integrations / API</text><text x="466" y="588" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">CMS / roles</text><text x="466" y="628" fill="#D9DEE6" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">QA / accessibility</text><rect x="820" y="304" width="644" height="396" rx="24" fill="#191C22" stroke="#292E36" stroke-width="1"/><rect x="850" y="328" width="116" height="34" rx="17" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="908" y="350" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.7">ESTIMATE</text><text x="850" y="388" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">A useful quote should show</text><text x="850" y="422" fill="#8B94A1" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" text-anchor="start">what is included, excluded, and owned.</text><rect x="850" y="466" width="562" height="64" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="874" y="505" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5">DELIVERABLES</text><text x="1060" y="505" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Named and measurable</text><rect x="850" y="548" width="562" height="64" rx="18" fill="#111318" stroke="#292E36" stroke-width="1"/><text x="874" y="587" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5">ASSUMPTIONS</text><text x="1060" y="587" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Dependencies made visible</text><rect x="850" y="630" width="562" height="42" rx="15" fill="#3A121A" stroke="#DC143C" stroke-width="1"/><text x="874" y="657" fill="#F5F7FA" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="1.5">COMPARE LIKE-FOR-LIKE</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="2.4">02 / SCOPE FIRST, PRICE SECOND</text><text x="1504" y="810" fill="#626B78" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>