<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">How to compare website proposals</title><desc id="desc">A proposal comparison checks equivalent scope, assumptions, exclusions, ownership, and support.</desc>
<rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/>
<text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">PROPOSAL REVIEW</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Compare scope parity, not headline price</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">A quote is comparable only when the work behind the number is comparable.</text>
<rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">04 / 06</text>
<rect x="96" y="286" width="1368" height="58" rx="16" fill="#20252D" stroke="#292E36"/><text x="118" y="321" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="1.6">CHECK</text><text x="518" y="321" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="1.8">QUOTE A</text><text x="820" y="321" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="1.8">QUOTE B</text><text x="1122" y="321" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="1.8">WHAT TO ASK</text>
<g font-family="Inter,Arial"><rect x="96" y="344" width="1368" height="64" rx="14" fill="#191C22" stroke="#292E36"/><text x="118" y="384" fill="#D9DEE6" font-size="15" font-weight="600">Page templates</text><circle cx="548" cy="376" r="7" fill="#DC143C"/><text x="570" y="384" fill="#F5F7FA" font-size="14" font-weight="600">Included</text><circle cx="850" cy="376" r="7" fill="#DC143C"/><text x="872" y="384" fill="#F5F7FA" font-size="14" font-weight="600">Included</text><text x="1122" y="384" fill="#8B94A1" font-size="14">How many?</text>
<rect x="96" y="408" width="1368" height="64" rx="14" fill="#15181D" stroke="#292E36"/><text x="118" y="448" fill="#D9DEE6" font-size="15" font-weight="600">Content production</text><circle cx="548" cy="440" r="7" fill="#DC143C"/><text x="570" y="448" fill="#F5F7FA" font-size="14" font-weight="600">Included</text><circle cx="850" cy="440" r="7" fill="#DC143C"/><text x="872" y="448" fill="#F5F7FA" font-size="14" font-weight="600">Included</text><text x="1122" y="448" fill="#8B94A1" font-size="14">Who writes it?</text>
<rect x="96" y="472" width="1368" height="64" rx="14" fill="#191C22" stroke="#292E36"/><text x="118" y="512" fill="#D9DEE6" font-size="15" font-weight="600">Integrations</text><circle cx="548" cy="504" r="7" fill="#DC143C"/><text x="570" y="512" fill="#F5F7FA" font-size="14" font-weight="600">Included</text><circle cx="850" cy="504" r="7" fill="#DC143C"/><text x="872" y="512" fill="#F5F7FA" font-size="14" font-weight="600">Included</text><text x="1122" y="512" fill="#8B94A1" font-size="14">Which systems?</text>
<rect x="96" y="536" width="1368" height="64" rx="14" fill="#15181D" stroke="#292E36"/><text x="118" y="576" fill="#D9DEE6" font-size="15" font-weight="600">QA + launch</text><circle cx="548" cy="568" r="7" fill="#DC143C"/><text x="570" y="576" fill="#F5F7FA" font-size="14" font-weight="600">Included</text><circle cx="850" cy="568" r="7" fill="#DC143C"/><text x="872" y="576" fill="#F5F7FA" font-size="14" font-weight="600">Included</text><text x="1122" y="576" fill="#8B94A1" font-size="14">Who tests?</text>
<rect x="96" y="600" width="1368" height="64" rx="14" fill="#191C22" stroke="#292E36"/><text x="118" y="640" fill="#D9DEE6" font-size="15" font-weight="600">Ownership</text><circle cx="548" cy="632" r="7" fill="#DC143C"/><text x="570" y="640" fill="#F5F7FA" font-size="14" font-weight="600">Defined?</text><circle cx="850" cy="632" r="7" fill="#DC143C"/><text x="872" y="640" fill="#F5F7FA" font-size="14" font-weight="600">Included</text><text x="1122" y="640" fill="#8B94A1" font-size="14">Who owns assets?</text>
<rect x="96" y="664" width="1368" height="64" rx="14" fill="#15181D" stroke="#292E36"/><text x="118" y="704" fill="#D9DEE6" font-size="15" font-weight="600">Support</text><circle cx="548" cy="696" r="7" fill="#3B414B"/><text x="570" y="704" fill="#626B78" font-size="14" font-weight="600">Defined?</text><circle cx="850" cy="696" r="7" fill="#3B414B"/><text x="872" y="704" fill="#626B78" font-size="14" font-weight="600">Unclear</text><text x="1122" y="704" fill="#8B94A1" font-size="14">What is ongoing?</text></g>
<rect x="96" y="744" width="1368" height="46" rx="14" fill="#3A121A" stroke="#DC143C"/><text x="120" y="774" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">Best comparison:</text><text x="258" y="774" fill="#F5F7FA" font-family="Inter,Arial" font-size="14" font-weight="600">same scope + same assumptions + same ownership terms + same launch definition.</text>
<text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">04 / COMPARE EVIDENCE, NOT LABELS</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>