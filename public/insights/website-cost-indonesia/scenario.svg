<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Website budget scenario</title><desc id="desc">A B2B company with five core pages can still require substantial design, integration, QA, and CMS work.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">SCENARIO</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Why five pages can still be complex</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">Visible page count does not reveal content, integration, or ownership effort.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">05 / 06</text><rect x="96" y="294" width="360" height="410" rx="24" fill="#191C22" stroke="#292E36"/><rect x="122" y="318" width="104" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="174" y="340" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">BUSINESS</text><text x="122" y="374" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">B2B company</text><text x="122" y="412" fill="#D9DEE6" font-family="Inter,Arial" font-size="18" font-weight="600">5 core pages</text><circle cx="132" cy="454" r="7" fill="#3B414B"/><text x="154" y="460" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Services + case studies</text><circle cx="132" cy="496" r="7" fill="#DC143C"/><text x="154" y="502" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Lead form + CRM</text><circle cx="132" cy="538" r="7" fill="#3B414B"/><text x="154" y="544" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Analytics + consent</text><circle cx="132" cy="580" r="7" fill="#3B414B"/><text x="154" y="586" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">CMS for editors</text><text x="122" y="628" fill="#626B78" font-family="Inter,Arial" font-size="13" font-weight="700">THE PAGE COUNT LOOKS SMALL.</text><text x="122" y="656" fill="#F5F7FA" font-family="Inter,Arial" font-size="19" font-weight="700">The work does not.</text><rect x="510" y="294" width="442" height="410" rx="24" fill="#15181D" stroke="#292E36"/><rect x="538" y="318" width="132" height="34" rx="17" fill="#20252D" stroke="#292E36"/><text x="604" y="340" text-anchor="middle" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">HIDDEN WORK</text><text x="538" y="374" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">What adds effort</text><circle cx="544" cy="428" r="7" fill="#3B414B"/><text x="566" y="434" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Custom information architecture</text><circle cx="544" cy="476" r="7" fill="#3B414B"/><text x="566" y="482" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Content model + editor roles</text><circle cx="544" cy="524" r="7" fill="#3B414B"/><text x="566" y="530" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">CRM / form integration</text><circle cx="544" cy="572" r="7" fill="#DC143C"/><text x="566" y="578" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Responsive states + QA</text><circle cx="544" cy="620" r="7" fill="#3B414B"/><text x="566" y="626" fill="#D9DEE6" font-family="Inter,Arial" font-size="15">Ownership + launch</text><rect x="1004" y="294" width="460" height="410" rx="24" fill="#3A121A" stroke="#DC143C"/><rect x="1032" y="318" width="90" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1077" y="340" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">RESULT</text><text x="1032" y="374" fill="#F5F7FA" font-family="Inter,Arial" font-size="22" font-weight="700">A better estimate</text><text x="1032" y="420" fill="#F0B6C0" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="1.5">PRICE AGAINST</text><text x="1032" y="450" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">work packages</text><text x="1032" y="482" fill="#F5F7FA" font-family="Inter,Arial" font-size="20" font-weight="700">not just page count.</text><rect x="1032" y="540" width="388" height="84" rx="18" fill="#111318" stroke="#292E36"/><text x="1056" y="570" fill="#626B78" font-family="Inter,Arial" font-size="11" font-weight="700" letter-spacing="1.5">DECISION QUALITY</text><text x="1056" y="601" fill="#F5F7FA" font-family="Inter,Arial" font-size="17" font-weight="700">Clear scope = fewer surprises</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">05 / SCOPE EXPLAINS PRICE</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>