<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Website quote anatomy</title><desc id="desc">A practical framework reads a website proposal through deliverables, assumptions, dependencies, launch, and ownership.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">FRAMEWORK</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Read a website quote in five layers</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">The strongest proposal makes work, risk, and ownership easy to inspect.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">06 / 06</text><rect x="96" y="320" width="248" height="246" rx="22" fill="#191C22" stroke="#292E36"/><text x="120" y="368" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">01</text><text x="120" y="408" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="700">DELIVERABLES</text><text x="120" y="448" fill="#8B94A1" font-family="Inter,Arial" font-size="15">What is built?</text><text x="120" y="506" fill="#D9DEE6" font-family="Inter,Arial" font-size="16" font-weight="600">Pages + features</text><rect x="372" y="320" width="248" height="246" rx="22" fill="#191C22" stroke="#292E36"/><text x="396" y="368" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">02</text><text x="396" y="408" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="700">ASSUMPTIONS</text><text x="396" y="448" fill="#8B94A1" font-family="Inter,Arial" font-size="15">What is assumed?</text><text x="396" y="506" fill="#D9DEE6" font-family="Inter,Arial" font-size="16" font-weight="600">Content + approvals</text><rect x="648" y="320" width="248" height="246" rx="22" fill="#191C22" stroke="#292E36"/><text x="672" y="368" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">03</text><text x="672" y="408" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="700">DEPENDENCIES</text><text x="672" y="448" fill="#8B94A1" font-family="Inter,Arial" font-size="15">What can block it?</text><text x="672" y="506" fill="#D9DEE6" font-family="Inter,Arial" font-size="16" font-weight="600">APIs + vendors</text><rect x="924" y="320" width="248" height="246" rx="22" fill="#191C22" stroke="#292E36"/><text x="948" y="368" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">04</text><text x="948" y="408" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="700">LAUNCH</text><text x="948" y="448" fill="#8B94A1" font-family="Inter,Arial" font-size="15">What is tested?</text><text x="948" y="506" fill="#D9DEE6" font-family="Inter,Arial" font-size="16" font-weight="600">QA + analytics</text><rect x="1200" y="320" width="264" height="246" rx="22" fill="#3A121A" stroke="#DC143C"/><text x="1224" y="368" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">05</text><text x="1224" y="408" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="700">OWNERSHIP</text><text x="1224" y="448" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">Who controls it?</text><text x="1224" y="506" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="600">Source + access</text><rect x="96" y="626" width="1368" height="88" rx="20" fill="#111318" stroke="#292E36"/><text x="124" y="660" fill="#DC143C" font-family="Inter,Arial" font-size="11" font-weight="700" letter-spacing="1.8">KAPITECH PRINCIPLE</text><text x="124" y="693" fill="#F5F7FA" font-family="Inter,Arial" font-size="19" font-weight="600">A useful budget tells you what changes the work before the number becomes the headline.</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">06 / MAKE THE ESTIMATE EXPLAINABLE</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>