<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Corporate website and landing page information architecture</title><desc id="desc">A corporate website provides multiple exploration paths while a landing page narrows the path to one action.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">INFORMATION ARCHITECTURE</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Design the path the user needs</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">Structure should make the intended decision easier, not just make the page look complete.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">03 / 06</text><rect x="96" y="294" width="650" height="420" rx="24" fill="#191C22" stroke="#292E36"/><rect x="126" y="322" width="176" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="214" y="344" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">CORPORATE WEBSITE</text><rect x="126" y="372" width="236" height="60" rx="16" fill="#111318" stroke="#292E36"/><text x="150" y="407" fill="#F5F7FA" font-family="Inter,Arial" font-size="14" font-weight="700">HOME</text><rect x="386" y="372" width="220" height="60" rx="16" fill="#111318" stroke="#292E36"/><text x="410" y="407" fill="#F5F7FA" font-family="Inter,Arial" font-size="14" font-weight="700">SERVICES</text><rect x="126" y="450" width="236" height="60" rx="16" fill="#111318" stroke="#292E36"/><text x="150" y="485" fill="#F5F7FA" font-family="Inter,Arial" font-size="14" font-weight="700">CASE STUDIES</text><rect x="386" y="450" width="220" height="60" rx="16" fill="#111318" stroke="#292E36"/><text x="410" y="485" fill="#F5F7FA" font-family="Inter,Arial" font-size="14" font-weight="700">INSIGHTS</text><rect x="126" y="528" width="480" height="60" rx="16" fill="#111318" stroke="#292E36"/><text x="150" y="563" fill="#F5F7FA" font-family="Inter,Arial" font-size="14" font-weight="700">CONTACT / BOOK A CALL</text><text x="126" y="646" fill="#8B94A1" font-family="Inter,Arial" font-size="16">Explore → compare → validate → contact</text><rect x="786" y="294" width="678" height="420" rx="24" fill="#15181D" stroke="#292E36"/><rect x="816" y="322" width="148" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="890" y="344" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">LANDING PAGE</text><rect x="816" y="372" width="618" height="60" rx="16" fill="#111318" stroke="#292E36"/><text x="840" y="407" fill="#F5F7FA" font-family="Inter,Arial" font-size="14" font-weight="700">MESSAGE + PROOF</text><rect x="816" y="450" width="618" height="60" rx="16" fill="#111318" stroke="#292E36"/><text x="840" y="485" fill="#F5F7FA" font-family="Inter,Arial" font-size="14" font-weight="700">OFFER / VALUE</text><rect x="816" y="528" width="618" height="60" rx="16" fill="#3A121A" stroke="#DC143C"/><text x="840" y="563" fill="#F5F7FA" font-family="Inter,Arial" font-size="14" font-weight="700">PRIMARY ACTION</text><text x="816" y="646" fill="#F0B6C0" font-family="Inter,Arial" font-size="16">Message → proof → action</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">03 / ARCHITECTURE SHOULD FOLLOW INTENT</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>