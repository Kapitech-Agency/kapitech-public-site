<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Corporate website versus landing page</title><desc id="desc">A corporate website supports exploration while a landing page concentrates attention on one action.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">WEBSITE FORMAT</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">One builds context. One concentrates attention.</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">Corporate websites and landing pages are not substitutes in every situation.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">01 / 06</text><rect x="96" y="294" width="620" height="414" rx="24" fill="#191C22" stroke="#292E36"/><rect x="126" y="322" width="178" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="215" y="344" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">CORPORATE WEBSITE</text><text x="126" y="392" fill="#F5F7FA" font-family="Inter,Arial" font-size="23" font-weight="700">Multi-page context</text><circle cx="134" cy="442" r="7" fill="#DC143C"/><text x="156" y="448" fill="#D9DEE6" font-family="Inter,Arial" font-size="16">Services + solutions</text><circle cx="134" cy="484" r="7" fill="#3B414B"/><text x="156" y="490" fill="#D9DEE6" font-family="Inter,Arial" font-size="16">Case studies + proof</text><circle cx="134" cy="526" r="7" fill="#3B414B"/><text x="156" y="532" fill="#D9DEE6" font-family="Inter,Arial" font-size="16">Company + people</text><circle cx="134" cy="568" r="7" fill="#3B414B"/><text x="156" y="574" fill="#D9DEE6" font-family="Inter,Arial" font-size="16">Insights + resources</text><rect x="126" y="616" width="560" height="58" rx="16" fill="#111318" stroke="#292E36"/><text x="150" y="651" fill="#626B78" font-family="Inter,Arial" font-size="11" font-weight="700">PRIMARY JOB</text><text x="260" y="651" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="700">Explore, validate, trust</text><rect x="758" y="294" width="706" height="414" rx="24" fill="#15181D" stroke="#292E36"/><rect x="788" y="322" width="150" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="863" y="344" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">LANDING PAGE</text><text x="788" y="392" fill="#F5F7FA" font-family="Inter,Arial" font-size="23" font-weight="700">Single focused journey</text><circle cx="796" cy="442" r="7" fill="#DC143C"/><text x="818" y="448" fill="#D9DEE6" font-family="Inter,Arial" font-size="16">One campaign / offer</text><circle cx="796" cy="484" r="7" fill="#3B414B"/><text x="818" y="490" fill="#D9DEE6" font-family="Inter,Arial" font-size="16">One defined audience</text><circle cx="796" cy="526" r="7" fill="#3B414B"/><text x="818" y="532" fill="#D9DEE6" font-family="Inter,Arial" font-size="16">One primary action</text><circle cx="796" cy="568" r="7" fill="#3B414B"/><text x="818" y="574" fill="#D9DEE6" font-family="Inter,Arial" font-size="16">Minimal competing paths</text><rect x="788" y="616" width="646" height="58" rx="16" fill="#3A121A" stroke="#DC143C"/><text x="812" y="651" fill="#F0B6C0" font-family="Inter,Arial" font-size="11" font-weight="700">PRIMARY JOB</text><text x="922" y="651" fill="#F5F7FA" font-family="Inter,Arial" font-size="16" font-weight="700">Turn attention into action</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">01 / CONTEXT VS CONCENTRATION</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>