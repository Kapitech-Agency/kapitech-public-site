<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Website format framework</title><desc id="desc">Breadth, focus, and the need for both context and conversion determine whether to use a corporate website, landing page, or both.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">FRAMEWORK</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Choose one, or design the two-layer system</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">Structure the experience around the traffic and decision it needs to support.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">06 / 06</text><rect x="96" y="298" width="410" height="380" rx="24" fill="#191C22" stroke="#292E36"/><text x="122" y="340" fill="#DC143C" font-family="Inter,Arial" font-size="12" font-weight="700">01 / BREADTH</text><text x="122" y="386" fill="#F5F7FA" font-family="Inter,Arial" font-size="23" font-weight="700">Many audiences?</text><text x="122" y="430" fill="#8B94A1" font-family="Inter,Arial" font-size="15">Many services or use cases?</text><text x="122" y="462" fill="#8B94A1" font-family="Inter,Arial" font-size="15">Need trust content?</text><rect x="122" y="506" width="356" height="68" rx="16" fill="#111318" stroke="#292E36"/><text x="146" y="547" fill="#F5F7FA" font-family="Inter,Arial" font-size="17" font-weight="700">YES → CORPORATE SITE</text><text x="122" y="620" fill="#626B78" font-family="Inter,Arial" font-size="14">Context is part of the conversion.</text><rect x="546" y="298" width="410" height="380" rx="24" fill="#15181D" stroke="#292E36"/><text x="572" y="340" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">02 / FOCUS</text><text x="572" y="386" fill="#F5F7FA" font-family="Inter,Arial" font-size="23" font-weight="700">One campaign?</text><text x="572" y="430" fill="#8B94A1" font-family="Inter,Arial" font-size="15">One audience / offer?</text><text x="572" y="462" fill="#8B94A1" font-family="Inter,Arial" font-size="15">One primary action?</text><rect x="572" y="506" width="356" height="68" rx="16" fill="#111318" stroke="#292E36"/><text x="596" y="547" fill="#F5F7FA" font-family="Inter,Arial" font-size="17" font-weight="700">YES → LANDING PAGE</text><text x="572" y="620" fill="#626B78" font-family="Inter,Arial" font-size="14">Focus is the conversion system.</text><rect x="996" y="298" width="468" height="380" rx="24" fill="#3A121A" stroke="#DC143C"/><text x="1022" y="340" fill="#F0B6C0" font-family="Inter,Arial" font-size="12" font-weight="700">03 / COMBINE</text><text x="1022" y="386" fill="#F5F7FA" font-family="Inter,Arial" font-size="23" font-weight="700">Both jobs?</text><text x="1022" y="430" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">Use the corporate site for</text><text x="1022" y="458" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">context + trust</text><text x="1022" y="500" fill="#F0B6C0" font-family="Inter,Arial" font-size="15">and landing pages for</text><text x="1022" y="528" fill="#F5F7FA" font-family="Inter,Arial" font-size="18" font-weight="700">campaign focus.</text><rect x="1022" y="570" width="414" height="62" rx="16" fill="#111318" stroke="#292E36"/><text x="1046" y="608" fill="#F5F7FA" font-family="Inter,Arial" font-size="15" font-weight="700">ONE ECOSYSTEM · TWO JOURNEYS</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">06 / DESIGN AROUND TRAFFIC INTENT</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>