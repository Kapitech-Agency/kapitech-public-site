<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Corporate website versus landing page comparison</title><desc id="desc">Comparison of audience, content depth, navigation, traffic source, conversion, and best fit.</desc><rect width="1600" height="900" fill="#090A0C"/><rect x="48" y="48" width="1504" height="804" rx="34" fill="#111318" stroke="#292E36"/><text x="96" y="118" fill="#DC143C" font-family="Inter,Arial" font-size="15" font-weight="700" letter-spacing="3.2">COMPARISON</text><text x="96" y="186" fill="#F5F7FA" font-family="Inter,Arial" font-size="42" font-weight="700">Different jobs, different structures</text><text x="96" y="224" fill="#8B94A1" font-family="Inter,Arial" font-size="19">Use the format that makes the user's next step obvious.</text><rect x="1360" y="88" width="96" height="34" rx="17" fill="#3A121A" stroke="#DC143C"/><text x="1408" y="110" text-anchor="middle" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">04 / 06</text><rect x="96" y="286" width="1368" height="56" rx="15" fill="#20252D" stroke="#292E36"/><text x="118" y="320" fill="#8B94A1" font-family="Inter,Arial" font-size="12" font-weight="700">FACTOR</text><text x="520" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">CORPORATE WEBSITE</text><text x="940" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">LANDING PAGE</text><text x="1218" y="320" fill="#F5F7FA" font-family="Inter,Arial" font-size="12" font-weight="700">PRIMARY JOB</text><g font-family="Inter,Arial"><rect x="96" y="342" width="1368" height="64" rx="14" fill="#191C22" stroke="#292E36"/><text x="118" y="382" fill="#D9DEE6" font-size="15" font-weight="600">Audience</text><text x="520" y="382" fill="#D9DEE6" font-size="14">Broad set</text><text x="940" y="382" fill="#D9DEE6" font-size="14">Defined segment</text><text x="1218" y="382" fill="#8B94A1" font-size="14">Explore</text><rect x="96" y="406" width="1368" height="64" rx="14" fill="#15181D" stroke="#292E36"/><text x="118" y="446" fill="#D9DEE6" font-size="15" font-weight="600">Content depth</text><text x="520" y="446" fill="#D9DEE6" font-size="14">High</text><text x="940" y="446" fill="#D9DEE6" font-size="14">Focused</text><text x="1218" y="446" fill="#8B94A1" font-size="14">Understand</text><rect x="96" y="470" width="1368" height="64" rx="14" fill="#191C22" stroke="#292E36"/><text x="118" y="510" fill="#D9DEE6" font-size="15" font-weight="600">Navigation</text><text x="520" y="510" fill="#D9DEE6" font-size="14">Many routes</text><text x="940" y="510" fill="#D9DEE6" font-size="14">One route</text><text x="1218" y="510" fill="#8B94A1" font-size="14">Orient</text><rect x="96" y="534" width="1368" height="64" rx="14" fill="#15181D" stroke="#292E36"/><text x="118" y="574" fill="#D9DEE6" font-size="15" font-weight="600">Traffic</text><text x="520" y="574" fill="#D9DEE6" font-size="14">Organic + direct</text><text x="940" y="574" fill="#D9DEE6" font-size="14">Campaign + paid</text><text x="1218" y="574" fill="#8B94A1" font-size="14">Match intent</text><rect x="96" y="598" width="1368" height="64" rx="14" fill="#191C22" stroke="#292E36"/><text x="118" y="638" fill="#D9DEE6" font-size="15" font-weight="600">Conversion</text><text x="520" y="638" fill="#D9DEE6" font-size="14">Multiple actions</text><text x="940" y="638" fill="#D9DEE6" font-size="14">One primary action</text><text x="1218" y="638" fill="#8B94A1" font-size="14">Act</text><rect x="96" y="662" width="1368" height="64" rx="14" fill="#3A121A" stroke="#DC143C"/><text x="118" y="702" fill="#F5F7FA" font-size="15" font-weight="600">Best fit</text><text x="520" y="702" fill="#F0B6C0" font-size="14">Long evaluation</text><text x="940" y="702" fill="#F5F7FA" font-size="14">Short decision</text><text x="1218" y="702" fill="#F0B6C0" font-size="14">Choose format</text></g><rect x="96" y="746" width="1368" height="44" rx="14" fill="#111318" stroke="#292E36"/><text x="120" y="774" fill="#F5F7FA" font-family="Inter,Arial" font-size="14" font-weight="700">A landing page can sit inside a larger corporate website strategy; the two formats can work together.</text><text x="96" y="810" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">04 / FORMAT FOLLOWS INTENT</text><text x="1504" y="810" text-anchor="end" fill="#626B78" font-family="Inter,Arial" font-size="12" font-weight="700" letter-spacing="2.4">KAPITECH / INSIGHTS</text></svg>