<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0B0C0E">
  <title>Page Not Found | Kapitech Agency</title>
  <style>
    :root{color-scheme:dark;background:#0B0C0E;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(229,9,20,.10),transparent 42%),#0B0C0E}
    main{width:min(680px,calc(100% - 40px));padding:48px 0;text-align:center}
    .eyebrow{margin:0 0 16px;color:#E50914;font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(40px,7vw,72px);line-height:.96;letter-spacing:-.055em}
    p{max-width:520px;margin:22px auto 0;color:#8A909D;font-size:16px;line-height:1.75}
    a{display:inline-flex;margin-top:32px;min-height:46px;align-items:center;justify-content:center;padding:0 22px;border-radius:999px;background:#E50914;color:#fff;text-decoration:none;font-size:13px;font-weight:600}
    a:hover{background:#FF1E27}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Kapitech Agency</p>
    <h1>Page not found.</h1>
    <p>The page you requested does not exist or has moved. Return to Kapitech and continue exploring our work and services.</p>
    <a href="/">Back to homepage</a>
  </main>
</body>
</html>
